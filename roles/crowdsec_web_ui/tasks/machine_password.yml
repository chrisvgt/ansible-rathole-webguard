---
# roles/crowdsec_web_ui/tasks/machine_password.yml
# Sets crowdsec_web_ui_lapi_password: crowdsec_web_ui_machine_password if set,
# otherwise a password generated once and stored in crowdsec_web_ui_machine_password_file.

- name: Check for a stored CrowdSec Web UI machine password
  ansible.builtin.stat:
    path: "{{ crowdsec_web_ui_machine_password_file }}"
  register: crowdsec_web_ui_password_stat
  when: crowdsec_web_ui_machine_password | default('') | length == 0

- name: Read stored CrowdSec Web UI machine password
  ansible.builtin.slurp:
    src: "{{ crowdsec_web_ui_machine_password_file }}"
  register: crowdsec_web_ui_password_slurp
  no_log: true
  when: crowdsec_web_ui_password_stat.stat.exists | default(false)

- name: Set CrowdSec Web UI machine password
  ansible.builtin.set_fact:
    crowdsec_web_ui_lapi_password: >-
      {{ crowdsec_web_ui_machine_password | default('', true)
         or (crowdsec_web_ui_password_slurp.content | b64decode | trim if crowdsec_web_ui_password_slurp is not skipped else '')
         or lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}
  no_log: true

# Created by root (the play uses become) and only readable by root
- name: Store generated machine password
  ansible.builtin.copy:
    content: "{{ crowdsec_web_ui_lapi_password }}\n"
    dest: "{{ crowdsec_web_ui_machine_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: crowdsec_web_ui_password_stat.stat is defined and not crowdsec_web_ui_password_stat.stat.exists
