---
# roles/crowdsec_web_ui/meta/main.yml

galaxy_info:
  author: chrisvgt
  description: CrowdSec Web UI in a Podman container, reached through a Rathole reverse tunnel
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions: ["bookworm", "trixie"]
    - name: Ubuntu
      versions: ["jammy", "noble"]
    - name: ArchLinux
      versions: ["all"]
  galaxy_tags:
    - crowdsec
    - podman
    - dashboard

# The crowdsec role is not a dependency on purpose: it must already be applied
# (enable_crowdsec: true), which the preflight checks assert.
dependencies: []
