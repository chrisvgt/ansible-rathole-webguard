---
# roles/xcaddy/tasks/main.yml

- name: Ensure xcaddy supports this platform
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in xcaddy_arch_map
    fail_msg: "Unsupported platform for xcaddy: {{ ansible_facts['system'] }}/{{ ansible_facts['architecture'] }}"

- name: Ensure xcaddy installation path exists
  ansible.builtin.file:
    path: "{{ xcaddy_install_path }}" # e.g., /usr/local/bin
    state: directory
    mode: "0755"

- name: Check current xcaddy version
  ansible.builtin.command:
    cmd: "{{ xcaddy_install_path }}/xcaddy --version"
  register: xcaddy_version_check
  failed_when: false
  changed_when: false
  check_mode: false # Read-only, safe to run in check mode

# In a new directory each time, removed again also when a step fails
- name: Install xcaddy
  when: (xcaddy_version_check.stdout | default('')).split()[:1] != ['v' ~ xcaddy_version]
  block:
    - name: Create a temporary download directory
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        suffix: xcaddy
      register: xcaddy_tmp_dir
      check_mode: false # Check mode needs it too; nothing is downloaded there

    - name: Download the xcaddy archive
      ansible.builtin.get_url:
        url: "{{ xcaddy_download_url }}"
        dest: "{{ xcaddy_tmp_dir.path }}/{{ xcaddy_download_url | basename }}"
        checksum: "sha512:{{ xcaddy_checksums_url }}"
        mode: "0644"
      register: xcaddy_download_result
      until: xcaddy_download_result is succeeded
      retries: 5
      delay: 2 # Retry download up to 5 times with a 2-second delay

    - name: Unpack xcaddy
      ansible.builtin.unarchive:
        src: "{{ xcaddy_tmp_dir.path }}/{{ xcaddy_download_url | basename }}"
        dest: "{{ xcaddy_tmp_dir.path }}"
        include: [xcaddy]
        remote_src: true
      when: not ansible_check_mode # Archive is only downloaded in a real run

    - name: Install the xcaddy binary
      ansible.builtin.copy:
        src: "{{ xcaddy_tmp_dir.path }}/xcaddy"
        dest: "{{ xcaddy_install_path }}/xcaddy"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      when: not ansible_check_mode

  always:
    - name: Remove the temporary download directory
      ansible.builtin.file:
        path: "{{ xcaddy_tmp_dir.path }}"
        state: absent
      check_mode: false # Also created in check mode
      when: xcaddy_tmp_dir.path is defined
