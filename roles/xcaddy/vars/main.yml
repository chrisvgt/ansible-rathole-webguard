---
# roles/xcaddy/vars/main.yml

# Map ansible_facts['architecture'] to xcaddy release arch identifiers
xcaddy_arch_map:
  x86_64: amd64
  aarch64: arm64
  arm64: arm64
  armv7l: armv7
  armv6l: armv6
xcaddy_arch: "{{ xcaddy_arch_map[ansible_facts['architecture']] }}" # Validated in tasks; unknown architectures fail early
