---
# roles/crowdsec/tasks/main.yml

# --- CrowdSec Role: Installation and Configuration ---

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - crowdsec_lapi_ip | default('') != ''
      - crowdsec_lapi_port | default('') != ''
    fail_msg: "Required CrowdSec variables (LAPI ip/port) are missing or empty."

## Installation

- name: Ensure CrowdSec data directory exists
  ansible.builtin.file:
    path: /var/lib/crowdsec
    state: directory
    owner: root
    group: root
    mode: "0755"

# Debian/Ubuntu: APT packages; Arch Linux: the vendors' release archives
- name: Install CrowdSec
  ansible.builtin.include_tasks: "install_{{ ansible_facts['os_family'] | lower }}.yml"

## Resource Limits (small hosts)

# Merged by CrowdSec over the packaged config.yaml, so package upgrades keep working
- name: Configure CrowdSec database flushing
  ansible.builtin.template:
    src: config.yaml.local.j2
    dest: /etc/crowdsec/config.yaml.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec

- name: Ensure CrowdSec systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit CrowdSec memory usage
  ansible.builtin.template:
    src: crowdsec-memory.conf.j2
    dest: /etc/systemd/system/crowdsec.service.d/memory.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec

## Post-Installation and Service Management

- name: Ensure CrowdSec service is enabled and started
  ansible.builtin.systemd:
    name: crowdsec
    state: started
    enabled: true
    daemon_reload: true

# Shipped with the package: daily `cscli hub update` + `hub upgrade` + reload,
# so collections and app whitelists follow upstream changes
- name: Ensure daily CrowdSec hub updates are enabled
  ansible.builtin.systemd:
    name: crowdsec-hubupdate.timer
    state: started
    enabled: true

## CrowdSec Hub Content Installation

- name: Update CrowdSec Hub
  ansible.builtin.command: cscli hub update
  register: crowdsec_cscli_hub_update_output
  changed_when: "'Nothing to do' not in crowdsec_cscli_hub_update_output.stdout"
  failed_when: crowdsec_cscli_hub_update_output.rc != 0
  until: crowdsec_cscli_hub_update_output is succeeded
  retries: 3
  delay: 5 # The hub CDN drops a connection now and then

# Includes base-http-scenarios collection, caddy-logs parser
- name: Check installed CrowdSec collections
  ansible.builtin.command: cscli collections list -o json
  register: crowdsec_cscli_collections_list
  changed_when: false
  failed_when: false
  check_mode: false # Read-only, safe to run in check mode

- name: Install CrowdSec collections
  ansible.builtin.command:
    argv: [cscli, collections, install, "{{ item }}"]
  register: crowdsec_collection_install
  changed_when: true
  until: crowdsec_collection_install is succeeded
  retries: 3
  delay: 5 # The hub CDN drops a connection now and then
  notify: Restart CrowdSec
  loop: "{{ crowdsec_collections }}"
  when: item not in (crowdsec_cscli_collections_list.stdout | default(''))

# Failed login detection relies on these scenarios from crowdsecurity/caddy
- name: Check installed CrowdSec scenarios
  ansible.builtin.command: cscli scenarios list -o json
  register: crowdsec_cscli_scenarios_list
  changed_when: false
  failed_when: false
  check_mode: false # Read-only, safe to run in check mode

- name: Check HTTP brute force scenarios are installed
  ansible.builtin.assert:
    that: "'crowdsecurity/http-generic-bf' in crowdsec_cscli_scenarios_list.stdout"
    fail_msg: "crowdsecurity/http-generic-bf is missing, failed logins are not detected. Run: cscli collections install crowdsecurity/caddy"
  when: crowdsec_cscli_scenarios_list.rc == 0

- name: Configure CrowdSec to listen for AppSec requests
  ansible.builtin.template:
    src: appsec.yaml.j2
    dest: /etc/crowdsec/acquis.d/appsec.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec

## CrowdSec Console and Bouncer Management

- name: Check CrowdSec Console enrollment status
  ansible.builtin.command: cscli console status -o json
  register: crowdsec_cscli_console_status
  changed_when: false
  failed_when: false
  check_mode: false # Read-only, safe to run in check mode

- name: Enroll CrowdSec engine with the Console
  ansible.builtin.command: "cscli console enroll --enable context {{ crowdsec_enrollment_key }}"
  register: crowdsec_console_enroll_output
  changed_when: "'Successfully enrolled with the Console' in crowdsec_console_enroll_output.stdout"
  failed_when: "crowdsec_console_enroll_output.rc != 0 and 'already enrolled' not in crowdsec_console_enroll_output.stderr and 'You are already enrolled' not in crowdsec_console_enroll_output.stdout"
  when:
    - crowdsec_enrollment_key is defined and (crowdsec_enrollment_key | length > 0)
    - crowdsec_cscli_console_status.rc == 0
    - (crowdsec_cscli_console_status.stdout | from_json).get('status', '') != 'ENROLLED'

- name: Resolve Caddy bouncer key
  ansible.builtin.include_tasks: bouncer_key.yml

- name: Check if Caddy bouncer is already registered
  ansible.builtin.command: cscli bouncers list -o json
  register: crowdsec_cscli_bouncers_list
  changed_when: false
  failed_when: false
  check_mode: false # Read-only, safe to run in check mode

- name: Determine whether the Caddy bouncer exists
  ansible.builtin.set_fact:
    crowdsec_caddy_bouncer_exists: >-
      {{ crowdsec_cscli_bouncers_list.rc == 0 and 'caddy-bouncer' in
         (crowdsec_cscli_bouncers_list.stdout | from_json | default([], true) | map(attribute='name') | list) }}

# CrowdSec cannot show a bouncer's key, so ask the LAPI whether it accepts ours:
# 200 means valid, 403 means the bouncer was registered with another key.
# HEAD leaves the bouncer's IP, version and last pull untouched.
# Retried because the LAPI may still be starting.
- name: Check the Caddy bouncer key against the Local API
  ansible.builtin.uri:
    url: "http://{{ crowdsec_lapi_ip }}:{{ crowdsec_lapi_port }}/v1/decisions"
    method: HEAD
    headers:
      X-Api-Key: "{{ crowdsec_bouncer_key }}"
    status_code: [200, 403]
  register: crowdsec_bouncer_key_check
  until: crowdsec_bouncer_key_check.status in [200, 403]
  retries: 10
  delay: 3
  no_log: true
  check_mode: false # Read-only, safe to run in check mode
  when: crowdsec_caddy_bouncer_exists | bool

- name: Remove Caddy bouncer registered with another key
  ansible.builtin.command:
    argv: [cscli, bouncers, delete, caddy-bouncer]
  changed_when: true
  when:
    - crowdsec_caddy_bouncer_exists | bool
    - crowdsec_bouncer_key_check.status == 403

- name: Register Caddy bouncer with CrowdSec Local API
  ansible.builtin.command:
    argv: [cscli, bouncers, add, caddy-bouncer, -k, "{{ crowdsec_bouncer_key }}"]
  no_log: true
  when: >-
    crowdsec_cscli_bouncers_list.rc == 0
    and (not crowdsec_caddy_bouncer_exists | bool or crowdsec_bouncer_key_check.status == 403)
  changed_when: true

- name: Configure CrowdSec to monitor Caddy access logs
  ansible.builtin.template:
    src: caddy.yaml.j2
    dest: /etc/crowdsec/acquis.d/caddy.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec

# The apps run on the client, so their own logs are out of reach; failed
# logins are recognised in the Caddy access log by path and status instead
- name: Configure failed login detection
  ansible.builtin.template:
    src: login-bf.yaml.j2
    dest: "{{ crowdsec_login_bf_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec
  when: crowdsec_login_detection | bool

- name: Remove failed login detection
  ansible.builtin.file:
    path: "{{ crowdsec_login_bf_file }}"
    state: absent
  notify: Restart CrowdSec
  when: not crowdsec_login_detection | bool

# The machine and bouncer for the blocklist import are managed by the crowdsec_import role

## CrowdSec Ntfy and Profile Configuration

- name: Ensure CrowdSec notifications directory exists (if Ntfy enabled)
  ansible.builtin.file:
    path: /etc/crowdsec/notifications/
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ntfy_enabled | default(false) | bool

- name: Create Ntfy notification configuration file
  ansible.builtin.template:
    src: ntfy.yaml.j2
    dest: /etc/crowdsec/notifications/ntfy.yaml
    owner: root
    group: root
    mode: "0600" # May contain the Ntfy auth token
  diff: false
  notify: Restart CrowdSec
  when: ntfy_enabled | default(false) | bool

- name: Check installed CrowdSec parsers
  ansible.builtin.command: cscli parsers list -o json
  register: crowdsec_cscli_parsers_list
  changed_when: false
  failed_when: false
  check_mode: false # Read-only, safe to run in check mode

- name: Create/update CrowdSec profiles.yaml for Ntfy or dynamic blocking
  ansible.builtin.template:
    src: profiles.yaml.j2
    dest: /etc/crowdsec/profiles.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec
  when: (ntfy_enabled | default(false) | bool) or (duration_expr | default(false) | bool)

## CrowdSec Whitelist Configuration

# The whitelists keep normal use of Nextcloud, Jellyfin, Seerr, ... from getting
# users banned; GeoIP adds the country to the Ntfy notifications
- name: Install hub parsers
  ansible.builtin.command:
    argv: [cscli, parsers, install, "{{ item }}"]
  register: crowdsec_parser_install
  changed_when: true
  until: crowdsec_parser_install is succeeded
  retries: 3
  delay: 5 # The hub CDN drops a connection now and then
  notify: Restart CrowdSec
  loop: "{{ crowdsec_hub_whitelists + (['crowdsecurity/geoip-enrich'] if ntfy_enabled | default(false) | bool else []) }}"
  when: item not in (crowdsec_cscli_parsers_list.stdout | default(''))

- name: Ignore expired sessions outside login paths
  ansible.builtin.template:
    src: session-whitelist.yaml.j2
    dest: "{{ crowdsec_session_whitelist_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec

- name: Ensure CrowdSec postoverflow whitelist directory exists
  ansible.builtin.file:
    path: /etc/crowdsec/postoverflows/s01-whitelist
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: dynamic_whitelist_enabled | default(false) | bool

- name: Add dynamic IPs to CrowdSec postoverflow whitelist
  ansible.builtin.template:
    src: 01-my-dynamic-whitelist.yaml.j2
    dest: /etc/crowdsec/postoverflows/s01-whitelist/01-my-dynamic-whitelist.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec
  when: dynamic_whitelist_enabled | default(false) | bool
