---
# roles/crowdsec/tasks/install_debian.yml
# Debian and Ubuntu: CrowdSec and the iptables bouncer from the CrowdSec APT repository

## CrowdSec APT repository

# packagecloud serves one repository for all releases (suite "any"), as the
# vendor's install script uses it. The signing key is checked against the
# pinned fingerprint instead of being trusted blindly.
- name: Install the packages to verify and fetch the repository key
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present

# The vendor's install script (before: curl | bash) wrote these files. Apt
# fails on a second source of the same repository with another Signed-By.
- name: Remove the repository files of the old install script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/crowdsec_crowdsec.list
    - /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg
  register: crowdsec_apt_old_files

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check for gpg
  ansible.builtin.stat:
    path: /usr/bin/gpg
  register: crowdsec_gpg

- name: Check for the CrowdSec repository key
  ansible.builtin.stat:
    path: /etc/apt/keyrings/crowdsec.asc
  register: crowdsec_apt_key_stat

# The key is only downloaded when the stored one is missing or not the pinned one
- name: Read the fingerprint of the stored CrowdSec repository key
  ansible.builtin.command: gpg --show-keys --with-colons /etc/apt/keyrings/crowdsec.asc
  register: crowdsec_apt_key_stored
  changed_when: false
  failed_when: false
  check_mode: false
  when: crowdsec_apt_key_stat.stat.exists and crowdsec_gpg.stat.exists

- name: Fetch and store the CrowdSec repository key
  # Check mode on a new server: gpg is not installed yet, so the key is not checked
  when: crowdsec_gpg.stat.exists or not ansible_check_mode
  vars:
    crowdsec_apt_key_pattern: "^pub:[^\n]*\nfpr:::::::::{{ crowdsec_apt_key_fingerprint | upper }}:$"
    crowdsec_apt_key_stored_ok: >-
      {{ crowdsec_apt_key_stored is not skipped
         and crowdsec_apt_key_stored.rc == 0
         and crowdsec_apt_key_stored.stdout is search(crowdsec_apt_key_pattern, multiline=True)
         and crowdsec_apt_key_stored.stdout_lines | select('match', '^pub:') | list | length == 1 }}
  block:
    - name: Download the CrowdSec repository key
      ansible.builtin.uri:
        url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
        return_content: true
      register: crowdsec_apt_key_download
      check_mode: false
      when: not crowdsec_apt_key_stored_ok | bool

    - name: Show the fingerprint of the downloaded CrowdSec repository key
      ansible.builtin.command: gpg --show-keys --with-colons
      args:
        stdin: "{{ crowdsec_apt_key_download.content }}"
      register: crowdsec_apt_key_new
      changed_when: false
      check_mode: false
      when: not crowdsec_apt_key_stored_ok | bool

    # Exactly one key, and it is the pinned one
    - name: Check the fingerprint of the downloaded CrowdSec repository key
      ansible.builtin.assert:
        that:
          - crowdsec_apt_key_new.stdout is search(crowdsec_apt_key_pattern, multiline=True)
          - crowdsec_apt_key_new.stdout_lines | select('match', '^pub:') | list | length == 1
        fail_msg: >-
          The key from https://packagecloud.io/crowdsec/crowdsec/gpgkey does not have the
          fingerprint {{ crowdsec_apt_key_fingerprint }} (crowdsec_apt_key_fingerprint).
          If CrowdSec changed its signing key, check the new fingerprint first.
        quiet: true
      when: not crowdsec_apt_key_stored_ok | bool

    - name: Store the CrowdSec repository key
      ansible.builtin.copy:
        content: "{{ crowdsec_apt_key_download.content }}"
        dest: /etc/apt/keyrings/crowdsec.asc
        owner: root
        group: root
        mode: "0644"
      register: crowdsec_apt_key
      when: not crowdsec_apt_key_stored_ok | bool

- name: Add the CrowdSec APT repository
  ansible.builtin.template:
    src: crowdsec.sources.j2
    dest: /etc/apt/sources.list.d/crowdsec.sources
    owner: root
    group: root
    mode: "0644"
  register: crowdsec_apt_sources

- name: Update the APT package lists for the CrowdSec repository
  ansible.builtin.apt:
    update_cache: true
  when: crowdsec_apt_old_files is changed or crowdsec_apt_key is changed or crowdsec_apt_sources is changed

- name: Keep CrowdSec at the versions of the playbook
  ansible.builtin.template:
    src: apt-preferences.j2
    dest: /etc/apt/preferences.d/crowdsec
    owner: root
    group: root
    mode: "0644"
  register: crowdsec_apt_pin

# Check mode does not write the new pin or repository, and apt refuses a version the old pin excludes
- name: Install CrowdSec agent and iptables bouncer
  ansible.builtin.apt:
    name:
      - "crowdsec={{ crowdsec_version }}"
      - iptables # Provides ip6tables; the bouncer package depends on it anyway
      - "crowdsec-firewall-bouncer-iptables={{ crowdsec_firewall_bouncer_version }}"
    state: present
    allow_downgrade: true # The versions of the playbook win
  notify: Restart CrowdSec
  when: >-
    not (ansible_check_mode
         and (crowdsec_apt_pin is changed
              or crowdsec_apt_sources is changed
              or crowdsec_apt_key is changed))

## IPv6 bans

# The package config has disable_ipv6: false; set explicitly, so IPv6 attackers
# are banned for sure. The file only exists once the package is installed
# (not in check mode on a new server).
- name: Check for the firewall bouncer configuration
  ansible.builtin.stat:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
  register: crowdsec_bouncer_config

- name: Ban IPv6 addresses with the firewall bouncer
  ansible.builtin.lineinfile:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: "^disable_ipv6:"
    line: "disable_ipv6: false"
  notify: Restart CrowdSec firewall bouncer
  when: crowdsec_bouncer_config.stat.exists

# The bouncer in iptables mode uses ip6tables for IPv6 bans
- name: Check that ip6tables is available
  ansible.builtin.command: ip6tables --version
  changed_when: false
  when: not ansible_check_mode

## SSH detection

# Without rsyslog (e.g. minimal Debian) there is no /var/log/auth.log, which the
# package reads; then sshd is read from the journal. With the file, the journal
# acquisition is removed again so every login attempt is counted once.
- name: Check for /var/log/auth.log
  ansible.builtin.stat:
    path: /var/log/auth.log
  register: crowdsec_auth_log

- name: Read sshd logs from the journal
  ansible.builtin.template:
    src: acquis-sshd-journal.yaml.j2
    dest: /etc/crowdsec/acquis.d/sshd.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec
  when: not crowdsec_auth_log.stat.exists

- name: Remove the sshd journal acquisition
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d/sshd.yaml
    state: absent
  notify: Restart CrowdSec
  when: crowdsec_auth_log.stat.exists
