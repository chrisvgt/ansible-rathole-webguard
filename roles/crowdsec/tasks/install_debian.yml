---
# roles/crowdsec/tasks/install_debian.yml
# Debian and Ubuntu: CrowdSec and the iptables bouncer from the CrowdSec APT repository

- name: Check for the CrowdSec APT repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/crowdsec_crowdsec.list
  register: crowdsec_apt_repo

# Only on the first run: the script is downloaded, run and removed again
- name: Add the CrowdSec APT repository
  when: not crowdsec_apt_repo.stat.exists
  block:
    - name: Download CrowdSec APT install script
      ansible.builtin.get_url:
        url: https://install.crowdsec.net
        dest: /tmp/install_crowdsec.sh
        mode: "0755"

    - name: Add CrowdSec APT repository via script
      ansible.builtin.command: /bin/bash /tmp/install_crowdsec.sh
      args:
        creates: /etc/apt/sources.list.d/crowdsec_crowdsec.list

  always:
    - name: Remove the CrowdSec APT install script
      ansible.builtin.file:
        path: /tmp/install_crowdsec.sh
        state: absent

- name: Keep CrowdSec at the versions of the playbook
  ansible.builtin.template:
    src: apt-preferences.j2
    dest: /etc/apt/preferences.d/crowdsec
    owner: root
    group: root
    mode: "0644"
  register: crowdsec_apt_pin

# Check mode does not write the new pin, and apt refuses a version the old one excludes
- name: Install CrowdSec agent and iptables bouncer
  ansible.builtin.apt:
    name:
      - "crowdsec={{ crowdsec_version }}"
      - iptables # Provides ip6tables; the bouncer package depends on it anyway
      - "crowdsec-firewall-bouncer-iptables={{ crowdsec_firewall_bouncer_version }}"
    state: present
    allow_downgrade: true # The versions of the playbook win
  notify: Restart CrowdSec
  when: not (ansible_check_mode and crowdsec_apt_pin is changed)

## IPv6 bans

# The package config has disable_ipv6: false; set explicitly, so IPv6 attackers
# are banned for sure. The file only exists once the package is installed
# (not in check mode on a new server).
- name: Check for the firewall bouncer configuration
  ansible.builtin.stat:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
  register: crowdsec_bouncer_config

- name: Ban IPv6 addresses with the firewall bouncer
  ansible.builtin.lineinfile:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: "^disable_ipv6:"
    line: "disable_ipv6: false"
  notify: Restart CrowdSec firewall bouncer
  when: crowdsec_bouncer_config.stat.exists

# The bouncer in iptables mode uses ip6tables for IPv6 bans
- name: Check that ip6tables is available
  ansible.builtin.command: ip6tables --version
  changed_when: false
  when: not ansible_check_mode

## SSH detection

# Without rsyslog (e.g. minimal Debian) there is no /var/log/auth.log, which the
# package reads; then sshd is read from the journal. With the file, the journal
# acquisition is removed again so every login attempt is counted once.
- name: Check for /var/log/auth.log
  ansible.builtin.stat:
    path: /var/log/auth.log
  register: crowdsec_auth_log

- name: Read sshd logs from the journal
  ansible.builtin.template:
    src: acquis-sshd-journal.yaml.j2
    dest: /etc/crowdsec/acquis.d/sshd.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart CrowdSec
  when: not crowdsec_auth_log.stat.exists

- name: Remove the sshd journal acquisition
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d/sshd.yaml
    state: absent
  notify: Restart CrowdSec
  when: crowdsec_auth_log.stat.exists
