---
# roles/crowdsec/handlers/main.yml

# --- Handlers for CrowdSec Service ---

- name: Restart CrowdSec
  ansible.builtin.systemd:
    name: crowdsec
    state: restarted
    daemon_reload: true

# Notified when the bouncer config changes (the package only restarts it on upgrades)
- name: Restart CrowdSec firewall bouncer
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    state: restarted
    daemon_reload: true
