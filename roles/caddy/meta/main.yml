---
# roles/caddy/meta/main.yml

galaxy_info:
  author: chrisvgt
  description: Install and configure Caddy with optional plugins (Cloudflare, CrowdSec)
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions: ["bullseye", "bookworm", "trixie"]
    - name: Ubuntu
      versions: ["focal", "jammy", "noble"]
    - name: ArchLinux
      versions: ["all"]
  galaxy_tags:
    - caddy
    - http
    - reverseproxy
    - tls
    - crowdsec
    - cloudflare

dependencies:
  - role: go_lang
  - role: xcaddy
