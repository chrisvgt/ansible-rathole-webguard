# roles/caddy/tasks/main.yml

# Caddy is built with CGO_ENABLED=0, so no C toolchain (build-essential) is needed
- name: Install Caddy build dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - logrotate
    state: present
    update_cache: true

- name: Create Caddy system group
  ansible.builtin.group:
    name: "{{ caddy_group }}"
    state: present
    system: true

- name: Create Caddy system user
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    system: true
    shell: "/usr/sbin/nologin"
    create_home: false
    state: present

- name: Ensure Caddy directories exist with correct ownership and permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(caddy_user) }}"
    group: "{{ caddy_group }}"
    mode: "{{ item.mode }}"
  loop:
    # Config holds secrets: Caddy may read it but not modify it
    - path: "{{ caddy_config_dir }}"
      owner: root
      mode: "0750"
    # Not recursive: Caddy manages permissions of its TLS keys/certs itself
    - path: "{{ caddy_data_dir }}"
      mode: "0750"
    - path: "{{ caddy_data_dir }}/caddy"
      mode: "0750"
    - path: "{{ caddy_log_dir }}"
      mode: "0755"

- name: Check installed Caddy version
  ansible.builtin.command:
    cmd: "{{ caddy_install_path }} version"
  register: caddy_version_check
  failed_when: false
  changed_when: false

# Coraza is needed if it is enabled globally or if any active site sets a
# coraza_mode other than 'off'. Caddyfile.j2 uses this fact as well, so the
# plugin is always built whenever the rendered config references coraza_waf.
- name: Determine if Coraza plugin needs to be built
  ansible.builtin.set_fact:
    caddy_coraza_needed: >-
      {{ (enable_coraza_waf | default(false) | bool)
         or (((enable_wildcard | default(false) | bool)
              | ternary(wildcard_sites | default([]) | map(attribute='sites', default=[]) | flatten,
                        caddy_sites | default([])))
             | selectattr('coraza_mode', 'defined')
             | rejectattr('coraza_mode', 'equalto', 'off')
             | list | length > 0) }}

# Own subdirectory so CrowdSec's /var/log/caddy/*.log acquisition glob does
# not parse the multi-line audit log format.
- name: Determine Coraza audit log directory
  ansible.builtin.set_fact:
    caddy_coraza_audit_log_dir: "{{ coraza_audit_log_dir | default(caddy_log_dir ~ '/coraza') }}"

- name: Ensure Coraza audit log directory exists
  ansible.builtin.file:
    path: "{{ caddy_coraza_audit_log_dir }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "0750"

- name: Configure logrotate for Coraza audit logs
  ansible.builtin.template:
    src: "templates/logrotate-coraza.j2"
    dest: "/etc/logrotate.d/caddy-coraza"
    owner: root
    group: root
    mode: "0644"

- name: Build final Caddy plugin list
  ansible.builtin.set_fact:
    caddy_plugins_effective: >-
      {{ (caddy_plugins | default([]))
         + (enable_cloudflare | default(false) | ternary(['github.com/caddy-dns/cloudflare'], []))
         + (enable_crowdsec | default(false) | ternary([
              'github.com/hslatman/caddy-crowdsec-bouncer/http',
              'github.com/hslatman/caddy-crowdsec-bouncer/layer4',
              'github.com/hslatman/caddy-crowdsec-bouncer/appsec'
            ], []))
         + (caddy_coraza_needed | bool | ternary(['github.com/corazawaf/coraza-caddy/v2'], []))
         + (enable_rate_limit | default(true) | ternary(['github.com/mholt/caddy-ratelimit'], [])) }}

- name: Compute hash of effective Caddy plugins
  ansible.builtin.set_fact:
    caddy_plugins_hash: "{{ caddy_plugins_effective | to_nice_json | hash('sha1') }}"

- name: Read previous Caddy plugins hash (if any)
  ansible.builtin.slurp:
    src: "{{ caddy_plugins_hash_file }}"
  register: caddy_plugins_hash_prev
  failed_when: false
  changed_when: false

# Only rebuild when the Caddy version or the plugin list changed. All Go
# caches live in caddy_build_dir and are removed afterwards, even on failure.
- name: Build Caddy with xcaddy
  when: >-
    ((caddy_version_check.stdout | default('') | regex_search('v([0-9.]+)', '\\1') | default(''))
    != (caddy_version | string))
    or
    ((caddy_plugins_hash_prev.content | default('') | b64decode | trim) != caddy_plugins_hash)
  block:
    - name: Create temporary Caddy build directory
      ansible.builtin.file:
        path: "{{ caddy_build_dir }}/tmp"
        state: directory
        mode: "0700"

    - name: Build Caddy with specified plugins using xcaddy
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/xcaddy build v{{ caddy_version }}
          --output {{ caddy_install_path }}
          {% for plugin in caddy_plugins_effective %} --with {{ plugin }}{% endfor %}
      environment:
        PATH: "{{ (go_lang_install_path | default('/usr/local')) ~ '/go/bin' }}:{{ ansible_facts['env'].PATH }}"
        # All plugins are pure Go: static binary, no C toolchain required
        CGO_ENABLED: "0"
        # Keep module cache, build cache and temp files out of /root and /tmp
        GOPATH: "{{ caddy_build_dir }}/go"
        GOCACHE: "{{ caddy_build_dir }}/cache"
        TMPDIR: "{{ caddy_build_dir }}/tmp"
        # Limit parallel compile jobs and GC headroom so small hosts don't run out of memory
        GOFLAGS: "-mod=mod -p={{ caddy_build_jobs }}"
        GOGC: "{{ caddy_build_gogc }}"
      notify: Restart Caddy Service
      changed_when: true

  always:
    - name: Remove temporary Caddy build directory
      ansible.builtin.file:
        path: "{{ caddy_build_dir }}"
        state: absent

- name: Set Caddy binary permissions
  ansible.builtin.file:
    path: "{{ caddy_install_path }}"
    mode: "0755"
    owner: root
    group: root

- name: Persist current Caddy plugins hash
  ansible.builtin.copy:
    content: "{{ caddy_plugins_hash }}\n"
    dest: "{{ caddy_plugins_hash_file }}"
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "0644"
  when: caddy_plugins_hash is defined

- name: Create Caddy environment file (secrets)
  ansible.builtin.template:
    src: "templates/caddy.env.j2"
    dest: "{{ caddy_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Caddy Service

# lstrip_blocks removes the indentation in front of Jinja tags so the rendered
# Caddyfile stays readable without running `caddy fmt` afterwards.
# The Caddyfile holds the CrowdSec API key, so it is only readable by root and
# the Caddy group. Set caddy_no_log: false to see validation errors.
- name: Create Caddyfile from template
  ansible.builtin.template:
    src: "templates/Caddyfile.j2"
    dest: "{{ caddy_config_file }}"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
    lstrip_blocks: true
    validate: "{{ caddy_install_path }} validate --adapter caddyfile --envfile {{ caddy_env_file }} --config %s"
  no_log: "{{ caddy_no_log | bool }}"
  notify: Reload Caddy Service

# `caddy validate` runs as root and creates missing log files owned by root,
# which the caddy user could not open afterwards.
- name: Ensure Caddy log files belong to the Caddy user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    recurse: true
  loop: "{{ [caddy_log_dir, caddy_coraza_audit_log_dir] | unique }}"

- name: Create Caddy Systemd unit file
  ansible.builtin.template:
    src: "templates/caddy.service.j2"
    dest: "/etc/systemd/system/caddy.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart Caddy Service

- name: Reload Systemd daemon to pick up new unit file
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and start Caddy service
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
  become: true

# Earlier versions of this role built in /root and never cleaned the build cache
- name: Remove Go caches left behind by previous Caddy builds
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/root/go/pkg/mod"
    - "/root/go/bin"
    - "/root/.cache/go-build"
