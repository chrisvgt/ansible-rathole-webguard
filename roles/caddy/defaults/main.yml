---
# roles/caddy/defaults/main.yml

# --- Caddy Installation & Configuration Paths ---
# renovate: datasource=github-releases depName=caddyserver/caddy extractVersion=^v(?<version>.+)$
caddy_version: "2.11.9" # Caddy version to install
caddy_user: caddy # System user for Caddy
caddy_group: caddy # System group for Caddy

# Base directories
caddy_install_dir: /usr/local/bin # Directory for Caddy executable
caddy_config_dir: /etc/caddy # Directory for Caddy configuration files
caddy_data_dir: /var/lib/caddy # Directory for Caddy's data (e.g., TLS certs)
caddy_log_dir: /var/log/caddy # Directory for Caddy's logs
# Certificates from Caddy's own CA instead of Let's Encrypt: for LAN-only
# domains without public DNS and for tests. Browsers do not trust them.
caddy_local_certs: false

# Full paths for common Caddy files
caddy_install_path: "{{ caddy_install_dir }}/caddy" # Full path to the Caddy executable
caddy_config_file: "{{ caddy_config_dir }}/Caddyfile" # Full path to the main Caddyfile
caddy_env_file: "{{ caddy_config_dir }}/caddy.env" # Root-only environment file for secrets (read by systemd)

# Hide the rendered Caddyfile (contains the CrowdSec API key) in task output.
# Set to false to see Caddyfile validation errors.
caddy_no_log: true

# --- Caddy Plugins ---
# Optional extra plugins can be specified by the user; by default, none are added here.
# Core plugins based on enable flags are resolved at runtime in tasks.
caddy_plugins: []

# Versions of the built-in plugins (xcaddy --with module@version). A change
# rebuilds Caddy once, because the plugin list hash changes.
# renovate: datasource=go depName=github.com/hslatman/caddy-crowdsec-bouncer
caddy_plugin_crowdsec_version: "v0.15.0"
# renovate: datasource=go depName=github.com/caddy-dns/cloudflare
caddy_plugin_cloudflare_version: "v0.2.4"
# renovate: datasource=go depName=github.com/corazawaf/coraza-caddy/v2
caddy_plugin_coraza_version: "v2.6.2"
# caddy-ratelimit has a single old tag (v0.1.0); this is the pseudo-version of
# the current main commit. Renovate's go datasource tracks it.
# renovate: datasource=go depName=github.com/mholt/caddy-ratelimit
caddy_plugin_ratelimit_version: "v0.1.1-0.20260612195517-5625512f24f6"

# --- Client IP behind a CDN / reverse proxy (off by default) ---
# Source ranges of the proxy in front of Caddy, e.g. Cloudflare's. Only requests
# from these ranges may set the client IP via the headers below; the rate limit
# and CrowdSec then see the real visitor. Empty: the TCP peer address is used.
caddy_trusted_proxies: []
# Headers carrying the client IP, e.g. [CF-Connecting-IP] or [X-Forwarded-For]
caddy_client_ip_headers: []

# --- Coraza Audit Log Rotation (logrotate, checked daily) ---
caddy_coraza_audit_log_max_size: 10M # Rotate once a file exceeds this size
caddy_coraza_audit_log_rotate: 3 # Number of compressed rotations to keep

# --- Caddy Build (xcaddy) ---
# Temporary build dir, removed after each build. /var/tmp instead of /tmp
# because /tmp is often a RAM-backed tmpfs on small hosts.
caddy_build_dir: /var/tmp/caddy-build
caddy_build_jobs: 1 # Parallel Go compile jobs (go build -p); 1 keeps peak RAM low on 2 GB hosts
caddy_build_gogc: 50 # Go GC target for the compiler; lower = less memory, slightly slower build

# File to record the hash of the effective Caddy plugin list to trigger rebuilds when it changes
caddy_plugins_hash_file: "{{ caddy_data_dir }}/.plugins.sha1"
