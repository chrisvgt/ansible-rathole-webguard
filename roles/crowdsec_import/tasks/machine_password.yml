---
# roles/crowdsec_import/tasks/machine_password.yml
# Sets crowdsec_import_blocklist_machine_password: crowdsec_machine_password if
# set, otherwise a password generated once and stored in
# crowdsec_import_machine_password_file.

- name: Check for a stored blocklist import machine password
  ansible.builtin.stat:
    path: "{{ crowdsec_import_machine_password_file }}"
  register: crowdsec_import_password_stat
  when: crowdsec_machine_password | default('') | length == 0

- name: Read stored blocklist import machine password
  ansible.builtin.slurp:
    src: "{{ crowdsec_import_machine_password_file }}"
  register: crowdsec_import_password_slurp
  no_log: true
  when: crowdsec_import_password_stat.stat.exists | default(false)

- name: Set blocklist import machine password
  ansible.builtin.set_fact:
    crowdsec_import_blocklist_machine_password: >-
      {{ crowdsec_machine_password | default('', true)
         or (crowdsec_import_password_slurp.content | b64decode | trim if crowdsec_import_password_slurp is not skipped else '')
         or lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}
  no_log: true

# Created by root (the play uses become) and only readable by root
- name: Ensure directory for the machine password exists
  ansible.builtin.file:
    path: "{{ crowdsec_import_machine_password_file | dirname }}"
    state: directory
    mode: "0755"
  when: crowdsec_import_password_stat.stat is defined and not crowdsec_import_password_stat.stat.exists

- name: Store generated machine password
  ansible.builtin.copy:
    content: "{{ crowdsec_import_blocklist_machine_password }}\n"
    dest: "{{ crowdsec_import_machine_password_file }}"
    mode: "0600"
  no_log: true
  when: crowdsec_import_password_stat.stat is defined and not crowdsec_import_password_stat.stat.exists
