---
# roles/crowdsec_import/meta/main.yml

galaxy_info:
  author: chrisvgt
  description: Import threat intelligence blocklists into CrowdSec
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions: ["bookworm", "trixie"]
    - name: Ubuntu
      versions: ["jammy", "noble"]
    - name: ArchLinux
      versions: ["all"]
  galaxy_tags:
    - crowdsec
    - security
    - blocklist

# The crowdsec role is not a dependency on purpose: it must already be applied
# (enable_crowdsec: true), which is asserted at the start of this role's tasks.
dependencies:
  - role: python
