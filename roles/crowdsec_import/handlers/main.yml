---
# roles/crowdsec_import/handlers/main.yml

- name: Restart CrowdSec Blocklist Import Timer
  ansible.builtin.systemd:
    daemon_reload: true
    enabled: true
    name: crowdsec-blocklist-import.timer
    state: restarted
  notify: Restart CrowdSec Blocklist Import

- name: Restart CrowdSec Blocklist Import
  ansible.builtin.systemd:
    name: crowdsec-blocklist-import.service
    state: restarted
