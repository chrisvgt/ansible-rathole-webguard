# CrowdSec Blocklist Import Variables
# These variables can be overridden in host_vars or group_vars
# Note: Variables use 'crowdsec_import_blocklist_' prefix to differentiate from normal crowdsec

# =============================================================================
# Required Settings (must be provided in host_vars/group_vars)
# =============================================================================

# CrowdSec LAPI URL (your CrowdSec instance)
crowdsec_import_blocklist_lapi_url: "{{ crowdsec_lapi_ip | default('127.0.0.1') }}:{{ crowdsec_lapi_port | default('8080') }}"

# CrowdSec LAPI Key (for reading existing decisions)
# This is the API key generated by the crowdsec role when creating the bouncer
crowdsec_import_blocklist_bouncer_key: "{{ crowdsec_blocklist_import_bouncer_key | default(crowdsec_api_key | default('')) }}"

# Machine credentials (required for writing decisions)
# Option 1: Use existing machine credentials from /etc/crowdsec/local_api_credentials.yaml
# Option 2: Create a new machine: cscli machines add blocklist-import --password 'YourSecurePassword'
crowdsec_import_blocklist_machine_password: "{{ crowdsec_machine_password | default(vault_crowdsec_machine_password | default(omit)) }}"
crowdsec_import_blocklist_machine_id: "{{ crowdsec_machine_id | default('blocklist-import') }}"

# =============================================================================
# Decision Settings
# =============================================================================

# How long decisions last (refresh daily with 24h)
crowdsec_import_blocklist_decision_duration: "{{ crowdsec_decision_duration | default('24h') }}"

# Decision reason (visible in cscli decisions list)
crowdsec_import_blocklist_decision_reason: "{{ crowdsec_decision_reason | default('external_blocklist') }}"

# Decision type (ban, captcha, throttle)
crowdsec_import_blocklist_decision_type: "{{ crowdsec_decision_type | default('ban') }}"

# Decision origin (for filtering)
crowdsec_import_blocklist_decision_origin: "{{ crowdsec_decision_origin | default('blocklist-import') }}"

# Decision scenario (for filtering)
crowdsec_import_blocklist_decision_scenario: "{{ crowdsec_decision_scenario | default('external/blocklist') }}"

# Allowlist - comma-separated IPs and/or CIDR ranges to exclude from bans
# Supports both individual IPs and CIDR notation for range matching
# Examples:
#   ALLOWLIST=1.2.3.4,5.6.7.8                    # Individual IPs
#   ALLOWLIST=140.82.112.0/20,185.199.108.0/22   # CIDR ranges
#   ALLOWLIST=1.2.3.4,140.82.112.0/20            # Mixed
crowdsec_import_blocklist_allowlist: "{{ crowdsec_allowlist | default('140.82.121.3,140.82.121.4') }}"

# Provider allowlists - auto-fetch IP ranges from well-known providers
# ALLOWLIST_GITHUB: Fetches GitHub's IP ranges from https://api.github.com/meta
#   Covers: git, web, api, hooks, and actions IP ranges
#   Falls back to hardcoded ranges if API is unreachable
# Default is false because:
# 1. GitHub IPs change frequently and can be large (1000+ IPs)
# 2. Most users don't need GitHub IPs in their blocklist
# 3. Can be enabled by setting crowdsec_allowlist_github: true in host_vars
crowdsec_import_blocklist_allowlist_github: "{{ crowdsec_allowlist_github | default(false) }}"

# =============================================================================
# Processing Settings
# =============================================================================

# Number of IPs to import per batch (memory vs. speed tradeoff)
crowdsec_import_blocklist_batch_size: "{{ crowdsec_batch_size | default(1000) }}"

# Timeout for fetching each blocklist (seconds)
crowdsec_import_blocklist_fetch_timeout: "{{ crowdsec_fetch_timeout | default(60) }}"

# Max retries for failed HTTP requests
crowdsec_import_blocklist_max_retries: "{{ crowdsec_max_retries | default(3) }}"

# Dry run (set to true to test without importing)
crowdsec_import_blocklist_dry_run: "{{ crowdsec_dry_run | default(false) }}"

# =============================================================================
# Logging
# =============================================================================

# Log level: DEBUG, INFO, WARN, ERROR
crowdsec_import_blocklist_log_level: "{{ crowdsec_log_level | default('INFO') }}"

# =============================================================================
# Telemetry
# =============================================================================

# Anonymous usage telemetry (set to false to disable)
crowdsec_import_blocklist_telemetry_enabled: "{{ crowdsec_telemetry_enabled | default(true) }}"

# =============================================================================
# Blocklist Enables (all true by default)
# Set to false to disable specific blocklists
# =============================================================================

# Aggregated threat intel (IPs on 3+ blocklists)
crowdsec_import_blocklist_enable_ipsum: "{{ crowdsec_enable_ipsum | default(true) }}"

# Spamhaus DROP (known hijacked netblocks)
crowdsec_import_blocklist_enable_spamhaus: "{{ crowdsec_enable_spamhaus | default(true) }}"

# Blocklist.de (all/ssh/apache/mail)
crowdsec_import_blocklist_enable_blocklist_de: "{{ crowdsec_enable_blocklist_de | default(true) }}"

# Firehol level1 and level2
crowdsec_import_blocklist_enable_firehol: "{{ crowdsec_enable_firehol | default(true) }}"

# Abuse.ch (Feodo, URLhaus)
crowdsec_import_blocklist_enable_abuse_ch: "{{ crowdsec_enable_abuse_ch | default(true) }}"

# Emerging Threats compromised IPs
crowdsec_import_blocklist_enable_emerging_threats: "{{ crowdsec_enable_emerging_threats | default(true) }}"

# Binary Defense ban list
crowdsec_import_blocklist_enable_binary_defense: "{{ crowdsec_enable_binary_defense | default(true) }}"

# Bruteforce Blocker
crowdsec_import_blocklist_enable_bruteforce_blocker: "{{ crowdsec_enable_bruteforce_blocker | default(true) }}"

# DShield top attackers
crowdsec_import_blocklist_enable_dshield: "{{ crowdsec_enable_dshield | default(true) }}"

# CI Army bad reputation
crowdsec_import_blocklist_enable_ci_army: "{{ crowdsec_enable_ci_army | default(true) }}"

# Botvrij botnet C2
crowdsec_import_blocklist_enable_botvrij: "{{ crowdsec_enable_botvrij | default(true) }}"

# GreenSnow attacker IPs
crowdsec_import_blocklist_enable_greensnow: "{{ crowdsec_enable_greensnow | default(true) }}"

# StopForumSpam toxic IPs
crowdsec_import_blocklist_enable_stopforumspam: "{{ crowdsec_enable_stopforumspam | default(true) }}"

# Tor exit nodes (may cause false positives for Tor users)
crowdsec_import_blocklist_enable_tor: "{{ crowdsec_enable_tor | default(true) }}"

# Scanner IPs (Shodan, Censys)
crowdsec_import_blocklist_enable_scanners: "{{ crowdsec_enable_scanners | default(true) }}"

# AbuseIPDB public mirror by @borestad (no API key required)
crowdsec_import_blocklist_enable_abuse_ipdb: "{{ crowdsec_enable_abuse_ipdb | default(true) }}"

# AbuseIPDB direct API (optional — requires free account at abuseipdb.com)
# Free tier: 5 blacklist checks per day
# crowdsec_import_blocklist_abuseipdb_api_key: ""
# crowdsec_import_blocklist_abuseipdb_min_confidence: 90
# crowdsec_import_blocklist_abuseipdb_limit: 10000

crowdsec_import_blocklist_enable_cybercrime_tracker: "{{ crowdsec_enable_cybercrime_tracker | default(true) }}"
crowdsec_import_blocklist_enable_vxvault: "{{ crowdsec_enable_vxvault | default(true) }}"

# =============================================================================
# Output Settings
# =============================================================================

# Output file path (for file-based output)
crowdsec_import_blocklist_output_file: "{{ crowdsec_output_file | default('/var/lib/crowdsec/blocklists/crowdsec-blocklist.txt') }}"
