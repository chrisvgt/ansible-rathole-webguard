---
# roles/system/handlers/main.yml

# --- Handlers for System Tuning ---

- name: Restart Journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Apply Swap Sysctl Settings
  ansible.builtin.command: sysctl -p /etc/sysctl.d/60-swap.conf
  changed_when: true

# Read-only keys (e.g. in LXC containers) make sysctl fail, which must not stop the play.
# Keys the kernel does not know are skipped by sysctl --system with an error message only.
- name: Apply Hardening Sysctl Settings
  ansible.builtin.command: sysctl --system
  changed_when: true
  failed_when: false
