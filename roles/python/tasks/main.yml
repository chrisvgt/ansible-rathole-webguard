---
# roles/python/tasks/main.yml

# --- Python Role: Python and pipx ---
# pipx runs as root with its own PIPX_HOME (see crowdsec_import), so no user
# PATH setup is needed; that also works without ansible_user in the inventory.

- name: Install pipx via distribution package manager (preferred method)
  ansible.builtin.apt:
    name: pipx
    state: present
  when: ansible_facts['os_family'] == "Debian"
