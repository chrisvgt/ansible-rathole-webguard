---
# roles/rathole/tasks/secrets.yml
# Tunnel tuple mode: Noise keys and the default token are created once on the
# server and stored in rathole_config_path. The client reads the public key and
# the token from its server. Values set in the tuple file take precedence.

# The files live on the server, so the client uses the server's config path
- name: Set Rathole secret file paths
  ansible.builtin.set_fact:
    rathole_noise_key_file: "{{ rathole_secrets_path }}/noise.key"
    rathole_noise_pub_file: "{{ rathole_secrets_path }}/noise.pub"
    rathole_token_file: "{{ rathole_secrets_path }}/default_token"
    rathole_uses_noise: "{{ rathole_transport.type | default('') == 'noise' }}"
  vars:
    rathole_secrets_path: >-
      {{ rathole_config_path if rathole_role == 'server'
         else hostvars[rathole_tunnel_server]['rathole_config_path'] | default(rathole_config_path_default) }}

# --- Server: create missing secrets ---
- name: Create Rathole secrets on the server
  when: rathole_role == 'server'
  block:
    - name: Check for existing Noise key
      ansible.builtin.stat:
        path: "{{ rathole_noise_key_file }}"
      register: rathole_noise_key_stat
      when:
        - rathole_uses_noise | bool
        - rathole_noise_private_key is undefined

    - name: Generate Noise key pair
      ansible.builtin.command: "{{ rathole_install_path }}/{{ rathole_binary_name }} --genkey"
      register: rathole_genkey
      changed_when: true
      no_log: true
      when:
        - rathole_noise_key_stat.stat is defined
        - not rathole_noise_key_stat.stat.exists

    # Output format: "Private Key:\n<base64>\n\nPublic Key:\n<base64>"
    - name: Store Noise key pair
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ rathole_genkey.stdout | regex_search(item.label ~ ':\\s*(\\S+)', '\\1') | first }}\n"
        owner: root
        group: "{{ rathole_group }}"
        mode: "{{ item.mode }}"
      loop:
        - { label: Private Key, dest: "{{ rathole_noise_key_file }}", mode: "0640" }
        - { label: Public Key, dest: "{{ rathole_noise_pub_file }}", mode: "0644" }
      no_log: true
      when: rathole_genkey is not skipped

    - name: Check for existing default token
      ansible.builtin.stat:
        path: "{{ rathole_token_file }}"
      register: rathole_token_stat
      when: rathole_default_token is undefined

    - name: Generate default token
      ansible.builtin.copy:
        dest: "{{ rathole_token_file }}"
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}\n"
        owner: root
        group: "{{ rathole_group }}"
        mode: "0640"
      no_log: true
      when:
        - rathole_token_stat.stat is defined
        - not rathole_token_stat.stat.exists

# --- Read secrets (server reads locally, client reads from its server) ---
- name: Ensure the server's Rathole secrets exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: rathole_secret_files
  delegate_to: "{{ rathole_tunnel_server }}"
  loop: >-
    {{ ([rathole_token_file] if rathole_default_token is undefined else [])
       + ([rathole_noise_pub_file] if rathole_uses_noise | bool and rathole_role == 'client' and rathole_noise_public_key is undefined else [])
       + ([rathole_noise_key_file] if rathole_uses_noise | bool and rathole_role == 'server' and rathole_noise_private_key is undefined else []) }}

- name: Fail when the server has no tunnel secrets yet
  ansible.builtin.fail:
    msg: "Run the playbook for {{ rathole_tunnel_server }} first: tunnel keys not found ({{ item.item }})."
  loop: "{{ rathole_secret_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  # In check mode a new server has not written its secrets yet
  when:
    - not item.stat.exists
    - not (ansible_check_mode and rathole_role == 'server')

- name: Read Rathole secrets
  ansible.builtin.slurp:
    src: "{{ item.item }}"
  register: rathole_secret_content
  delegate_to: "{{ rathole_tunnel_server }}"
  loop: "{{ rathole_secret_files.results | selectattr('stat.exists') | list }}"
  no_log: true

- name: Collect Rathole secrets
  ansible.builtin.set_fact:
    rathole_secrets: >-
      {{ {'noise.key': 'check-mode-placeholder', 'noise.pub': 'check-mode-placeholder', 'default_token': 'check-mode-placeholder'}
         | combine(dict(rathole_secret_content.results | map(attribute='item.item') | map('basename')
                        | zip(rathole_secret_content.results | map(attribute='content') | map('b64decode') | map('trim')))) }}
  no_log: true

- name: Add secrets to Rathole server config
  ansible.builtin.set_fact:
    rathole_server_config: >-
      {{ rathole_server_config
         | combine({'default_token': rathole_default_token | default(rathole_secrets['default_token'])})
         | combine({'transport': {'noise': {'local_private_key': rathole_noise_private_key | default(rathole_secrets['noise.key'])}}}
                   if rathole_uses_noise | bool else {}, recursive=true) }}
  no_log: true
  when: rathole_role == 'server'

- name: Add secrets to Rathole client config
  ansible.builtin.set_fact:
    rathole_client_config: >-
      {{ rathole_client_config
         | combine({'default_token': rathole_default_token | default(rathole_secrets['default_token'])})
         | combine({'transport': {'noise': {'remote_public_key': rathole_noise_public_key | default(rathole_secrets['noise.pub'])}}}
                   if rathole_uses_noise | bool else {}, recursive=true) }}
  no_log: true
  when: rathole_role == 'client'
