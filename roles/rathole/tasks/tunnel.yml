---
# roles/rathole/tasks/tunnel.yml
# Build rathole_server_config / rathole_client_config from tunnel_services.
# The server of a tuple is the host with the same tunnel_id and rathole_role 'server'.

- name: Validate tunnel tuple settings
  ansible.builtin.assert:
    that:
      - tunnel_id is defined
      - tunnel_services is sequence
      - tunnel_services | selectattr('name', 'undefined') | list | length == 0
      - tunnel_services | selectattr('local_addr', 'undefined') | list | length == 0
      - tunnel_services | map(attribute='name') | unique | list | length == tunnel_services | length
    fail_msg: >-
      tunnel_services needs tunnel_id, and every service needs a unique name and a local_addr.
    quiet: true

- name: Ensure tunnel mode is not mixed with legacy settings
  ansible.builtin.assert:
    that: lookup('ansible.builtin.varnames', '^' ~ item ~ '$') | length == 0
    fail_msg: "{{ item }} cannot be used together with tunnel_services. Move its entries into tunnel_services."
    quiet: true
  loop:
    - rathole_server_config
    - rathole_client_config
    - caddy_sites
    - wildcard_sites
  when: not (rathole_auto_secrets | default(false) | bool)

- name: Find hosts of this tunnel tuple
  ansible.builtin.set_fact:
    rathole_tuple_servers: >-
      {{ groups['all'] | map('extract', hostvars) | selectattr('tunnel_id', 'defined')
         | selectattr('tunnel_id', 'eq', tunnel_id) | selectattr('rathole_role', 'defined')
         | selectattr('rathole_role', 'eq', 'server') | map(attribute='inventory_hostname') | list }}
    rathole_tuple_clients: >-
      {{ groups['all'] | map('extract', hostvars) | selectattr('tunnel_id', 'defined')
         | selectattr('tunnel_id', 'eq', tunnel_id) | selectattr('rathole_role', 'defined')
         | selectattr('rathole_role', 'eq', 'client') | map(attribute='inventory_hostname') | list }}

- name: Ensure the tuple has one server and at most one client
  ansible.builtin.assert:
    that:
      - rathole_tuple_servers | length == 1
      - rathole_tuple_clients | length <= 1
    fail_msg: >-
      Tunnel '{{ tunnel_id }}' needs exactly one host with rathole_role=server and at most one client
      (servers: {{ rathole_tuple_servers }}, clients: {{ rathole_tuple_clients }}).
    quiet: true

- name: Build tunnel service lists
  ansible.builtin.set_fact:
    rathole_tunnel_server: "{{ rathole_tuple_servers | first }}"
    rathole_tunnel_server_services: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for s in tunnel_services -%}
        {%- set extra = s | dict2items | selectattr('key', 'in', ['type', 'token', 'nodelay']) | items2dict -%}
        {%- set bind = s.bind_addr | default('127.0.0.1:' ~ (s.local_addr | regex_replace('^.*:', ''))) -%}
        {%- set ns.out = ns.out + [{'name': s.name, 'bind_addr': bind} | combine(extra)] -%}
      {%- endfor -%}
      {{ ns.out }}
    rathole_tunnel_client_services: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for s in tunnel_services -%}
        {%- set extra = s | dict2items | selectattr('key', 'in', ['type', 'token', 'nodelay', 'retry_interval']) | items2dict -%}
        {%- set ns.out = ns.out + [{'name': s.name, 'local_addr': s.local_addr} | combine(extra)] -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Ensure each bind address and protocol is used once
  ansible.builtin.assert:
    that: >-
      rathole_tunnel_server_services | map(attribute='bind_addr') | zip(rathole_tunnel_server_services | map(attribute='type', default='tcp'))
      | map('join', '/') | unique | list | length == rathole_tunnel_server_services | length
    fail_msg: "Two services in tunnel '{{ tunnel_id }}' use the same bind_addr and type."
    quiet: true

- name: Build Rathole server config
  ansible.builtin.set_fact:
    rathole_server_config: >-
      {{ {'bind_addr': rathole_listen_addr | default('0.0.0.0:' ~ rathole_port), 'transport': rathole_transport,
          'services': rathole_tunnel_server_services}
         | combine({'heartbeat_interval': rathole_heartbeat_interval} if rathole_heartbeat_interval is defined else {}) }}
    rathole_auto_secrets: true
  when: rathole_role == 'server'

- name: Build Rathole client config
  ansible.builtin.set_fact:
    rathole_client_config: >-
      {{ {'remote_addr': (rathole_public_addr | default(hostvars[rathole_tunnel_server]['ansible_host'])) ~ ':' ~ rathole_port,
          'transport': rathole_transport, 'services': rathole_tunnel_client_services}
         | combine({'heartbeat_timeout': rathole_heartbeat_timeout} if rathole_heartbeat_timeout is defined else {})
         | combine({'retry_interval': rathole_retry_interval} if rathole_retry_interval is defined else {}) }}
    rathole_auto_secrets: true
  when: rathole_role == 'client'
