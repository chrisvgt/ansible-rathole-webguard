---
# roles/go_lang/defaults/main.yml

# renovate: datasource=golang-version depName=go
go_lang_version: "1.27.3" # Specify the desired Go version
go_lang_install_path: "/usr/local" # Base directory where Go will be installed (e.g., /usr/local/go)
go_lang_download_url: "https://go.dev/dl/{{ go_lang_archive_name }}" # Full URL for downloading the Go tarball
