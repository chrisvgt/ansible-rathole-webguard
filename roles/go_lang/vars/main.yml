---
# roles/go_lang/vars/main.yml

# Map ansible_facts['architecture'] to Go release arch identifiers
go_lang_arch_map:
  x86_64: amd64
  aarch64: arm64
  arm64: arm64
  armv7l: armv6l
  armv6l: armv6l
go_lang_archive_name: "go{{ go_lang_version }}.linux-{{ go_lang_arch_map[ansible_facts['architecture']] }}.tar.gz" # Constructs the archive filename based on OS architecture
go_lang_binary_path: "{{ go_lang_install_path }}/go/bin" # Path to the Go binaries (e.g., /usr/local/go/bin)
