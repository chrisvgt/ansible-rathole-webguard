---
# roles/go_lang/tasks/main.yml

- name: Ensure Go supports this platform
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in go_lang_arch_map
    fail_msg: "Unsupported platform for Go: {{ ansible_facts['system'] }}/{{ ansible_facts['architecture'] }}"

- name: Normalize Go installation path
  ansible.builtin.set_fact:
    go_lang_install_path: "{{ go_lang_install_path | regex_replace('/+$', '') }}"

- name: Ensure Go installation path exists
  ansible.builtin.file:
    path: "{{ go_lang_install_path }}" # Typically /usr/local
    state: directory
    mode: "0755"

- name: Check if Go is already installed
  ansible.builtin.command:
    cmd: "{{ go_lang_binary_path }}/go version"
  register: go_lang_version_check
  failed_when: false
  changed_when: false
  check_mode: false # Read-only, safe to run in check mode

# On disk, not in /tmp: Arch keeps /tmp in RAM, and the archive is large.
# Removed again also when a step fails.
- name: Install Go
  when: ('go' ~ go_lang_version ~ ' ') not in go_lang_version_check.stdout | default('')
  block:
    - name: Create a temporary download directory
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        suffix: go
      register: go_lang_tmp_dir

    - name: Download the Go archive
      ansible.builtin.get_url:
        url: "{{ go_lang_download_url }}"
        dest: "{{ go_lang_tmp_dir.path }}/{{ go_lang_archive_name }}"
        checksum: "sha256:{{ go_lang_download_url }}.sha256"
        mode: "0644"

    - name: Remove the previous Go installation
      ansible.builtin.file:
        path: "{{ go_lang_install_path }}/go"
        state: absent

    - name: Unpack Go
      ansible.builtin.unarchive:
        src: "{{ go_lang_tmp_dir.path }}/{{ go_lang_archive_name }}"
        dest: "{{ go_lang_install_path }}"
        remote_src: true
      when: not ansible_check_mode # Archive is only downloaded in a real run

  always:
    - name: Remove the temporary download directory
      ansible.builtin.file:
        path: "{{ go_lang_tmp_dir.path }}"
        state: absent
      when: go_lang_tmp_dir.path is defined

# Earlier versions set up Go for every login shell; the Caddy build sets its own PATH
- name: Remove the Go login profile
  ansible.builtin.file:
    path: /etc/profile.d/go_env.sh
    state: absent
