---
# Copy to host_vars/server.yml (gitignored). The file name must match the host
# name in inventory.ini.
#
# Secrets: either replace each "{{ vault_* }}" below with the plain value and
# run with --no-vault, or keep the references and define the vault_* variables
# in an Ansible Vault file (see README, "Secrets").

# --- Crowdsec Setup ---
crowdsec_api_key: "{{ vault_crowdsec_api_key }}" # Caddy bouncer key. Generate with: `head /dev/urandom | tr -dc A-Za-z0-9 | head -c 32`
crowdsec_enrollment_key: "{{ vault_crowdsec_enrollment_key }}" # Optional: enroll the engine in the CrowdSec Console (skipped if undefined or empty)
duration_expr: true # Enable dynamic increase of blocking time

# --- Crowdsec Blocklist Import Setup ---
# Required: CrowdSec LAPI credentials
#
# The machine and bouncer are created by the crowdsec_import role when
# enable_crowdsec_import is true. You only need to provide the password.
#
# Generate a password with:
# head /dev/urandom | tr -dc A-Za-z0-9 | head -c 32
#
crowdsec_machine_password: "{{ vault_crowdsec_machine_password }}" # Password for the blocklist-import machine
crowdsec_machine_id: "blocklist-import" # Machine ID (default: blocklist-import)

# Optional: Decision settings (customize if needed)
# crowdsec_decision_duration: "24h"
# crowdsec_decision_reason: "external_blocklist"
# crowdsec_decision_type: "ban"
# crowdsec_decision_origin: "blocklist-import"
# crowdsec_decision_scenario: "external/blocklist"

# Optional: Allowlist settings
# crowdsec_allowlist: "140.82.121.3,140.82.121.4"  # Default GitHub IPs
# crowdsec_allowlist_github: false  # Set to true to auto-fetch GitHub IPs

# Optional: Processing settings
# crowdsec_batch_size: 1000
# crowdsec_fetch_timeout: 60
# crowdsec_max_retries: 3
# crowdsec_dry_run: false  # Set to true to test without importing

# Optional: Logging
# crowdsec_log_level: "INFO"

# Optional: Blocklist enables (set to false to disable specific feeds)
# crowdsec_enable_ipsum: true
# crowdsec_enable_spamhaus: true
# crowdsec_enable_blocklist_de: true
# crowdsec_enable_firehol: true
# crowdsec_enable_abuse_ch: true
# crowdsec_enable_emerging_threats: true
# crowdsec_enable_binary_defense: true
# crowdsec_enable_bruteforce_blocker: true
# crowdsec_enable_dshield: true
# crowdsec_enable_ci_army: true
# crowdsec_enable_botvrij: true
# crowdsec_enable_greensnow: true
# crowdsec_enable_stopforumspam: true
# crowdsec_enable_tor: true  # May cause false positives for Tor users
# crowdsec_enable_scanners: true
# crowdsec_enable_abuse_ipdb: true
# crowdsec_enable_cybercrime_tracker: true
# crowdsec_enable_vxvault: true

# Optional: Output file path
# crowdsec_output_file: "/var/lib/crowdsec/blocklists/crowdsec-blocklist.txt"

dynamic_whitelist_enabled: false # Enable whitelist (resolved via DDNS)
dynamic_ddns_hostnames:
  - "ddns.example.com"

# --- Ntfy Setup ---
ntfy_enabled: false # Set to `true` to enable ntfy notifications
ntfy_server: "ntfy.example.com"
ntfy_topic: "crowdsec_alerts"
ntfy_auth_token: "" # Optional: Your ntfy authentication token

# --- Cloudflare Setup (only used with enable_cloudflare: true) ---
# API token with Zone:DNS:Edit for your zones. Ansible writes it to
# /etc/caddy/caddy.env (root, 0600) on the server; no manual env file needed.
cloudflare_api_token: "{{ vault_cloudflare_api_token_server }}"

# --- Small host tuning (system role, optional) ---
# system_swap_enabled: true # Recommended on 2 GB RAM hosts (Caddy build)
# system_swap_size: "1G"
# system_swappiness: 10
# system_journald_max_use: "200M"

# --- Caddy sites ---
# enable_wildcard: false -> caddy_sites is used (one certificate per domain)
# enable_wildcard: true  -> wildcard_sites is used (one wildcard certificate per
#                           base domain, requires enable_cloudflare: true)
# Each port is a local port on this server, usually a Rathole service bind_addr.
#
# Per-Site WAF control via coraza_mode:
#   "off"           → WAF disabled for this site
#   "minimal"       → WAF enabled: method + file upload protection only
#   "recommended"   → WAF enabled: null bytes, SQLi, XSS, path traversal
#   "moderate"      → WAF enabled: + command injection, RFI, Content-Type check
#   "strict"        → WAF enabled: + SSTI, aggressive SQLi/XSS/CMD rules
#   not set         → Falls back to global enable_coraza_waf / coraza_mode_default
#
# Per-Site cache_paths: customize caching paths (default: Jellyfin paths)
# Per-Site enable_forward: requires forward_path to be set (otherwise skipped)
caddy_sites:
  - name: blog # Used for default log file name
    domain: "blog.yourdomain.com"
    local_port: 2368
    # Enable WAF with minimal protection for blog
    coraza_mode: "minimal"
    # Optional: Custom cache paths for this site
    # cache_paths: "*.js *.css *.jpg *.png *.gif *.svg *.woff2 *.ttf"
    # Optional: Customize log settings per site
    # log_file: "/var/log/caddy/blog.access.log"
    # log_roll_size: "20mb"
    # log_roll_keep: 15
    # log_roll_keep_for: "48h"

  - name: stream
    domain: "stream.yourdomain.com"
    local_port: 8096
    # coraza_mode: "off" → WAF completely disabled for media streaming
    # Enable streaming mode (flush_interval -1 for smooth playback)
    stream: true
    # Disable AppSec (binary payloads cause timeouts)
    disable_appsec: true
    # Cache paths for Jellyfin (default, can be omitted)
    # cache_paths: "/Items/* /Images/* /web/* *.js *.css *.jpg *.png *.gif"

  - name: notify
    domain: "notify.yourdomain.com"
    local_port: 8004
    # Minimal WAF protection for notification service
    coraza_mode: "minimal"

# --- Wildcard sites (only used with enable_wildcard: true) ---
wildcard_sites:
  # --- yourdomain.com domain group -
  - domain: "*.yourdomain.com"
    sites:
      - name: blog
        subdomain: "blog"
        port: 2368
        # Per-Site WAF in wildcard mode
        # coraza_mode: "minimal"
        # cache_paths: "*.js *.css *.jpg *.png *.gif"
  # --- example.com domain group -
  - domain: "*.example.com"
    sites:
      - name: blog
        subdomain: "blog"
        port: 2368

# --- Rathole Server Configuration Example ---
rathole_role: "server" # Identifies this as a Rathole server configuration
rathole_server_config: # Top-level server settings
  listen_addr: "0.0.0.0:2333" # Address the Rathole server listens on for clients (open this port in your firewall)
  default_token: "default_token_for_all_services_if_not_specified" # Optional: Default token for all services
  heartbeat_interval: 30 # Optional: Heartbeat interval in seconds (0 to disable)

  # --- Transport Configuration (only the block matching "type" is used) ---
  transport:
    type: "noise" # Selected transport type: Noise for secure, lightweight encryption.

    # Noise Transport Configuration (pattern and local_private_key are required)
    noise:
      pattern: "Noise_NK_25519_ChaChaPoly_BLAKE2s"
      # Generate a key pair with `rathole --genkey`; the public key goes into the client config
      local_private_key: "your_server_private_key_base64"

    # TCP Transport
    tcp:
      nodelay: true
      keepalive_secs: 20
      keepalive_interval: 8

    # TLS Transport (the file must not be under /home: the service runs with ProtectHome)
    tls:
      pkcs12: "/etc/rathole/identity.pfx"
      pkcs12_password: "your_pkcs12_password"

    # WebSocket Transport
    websocket:
      tls: true # If true, uses settings from `server.transport.tls`

  # --- Service Definitions ---
  # Bind to 127.0.0.1 so services are only reachable through Caddy.
  # Binding to 0.0.0.0 would expose them directly, bypassing CrowdSec and the WAF.
  services:
    - name: "blog" # Unique service name (must match client side)
      type: "tcp" # Optional: Default is tcp. Can be "tcp" or "udp".
      token: "specific_token_for_blog" # Optional: Overrides `default_token`.
      bind_addr: "127.0.0.1:2368" # Local port Caddy proxies to (caddy_sites local_port)
      nodelay: true # Optional

    - name: "stream"
      bind_addr: "127.0.0.1:8096"
