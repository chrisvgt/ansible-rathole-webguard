# Minimal server images may lack Python, which Ansible modules need, and sudo.
# Runs before facts are gathered, with raw commands only.
- name: Prepare hosts for Ansible
  hosts: webservers
  become: false
  gather_facts: false
  tasks:
    - name: Check whether the login user is root
      ansible.builtin.raw: id -u
      register: bootstrap_uid
      changed_when: false
      check_mode: false # Read-only, safe to run in check mode
      tags: [always]

    # Logged in as root, become is not needed; without this Ansible would
    # still call sudo, which minimal images do not have
    - name: Run as the login user when it is root
      ansible.builtin.set_fact:
        ansible_become: false
      when: bootstrap_uid.stdout | trim == '0'
      tags: [always]

    - name: Install Python if it is missing
      ansible.builtin.raw: |
        command -v python3 >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null || exit 1
        elif command -v pacman >/dev/null 2>&1; then
          # Keyring first, then a full upgrade: Arch does not support partial upgrades
          pacman -Sy --noconfirm --needed archlinux-keyring >/dev/null &&
            pacman -Su --noconfirm >/dev/null &&
            pacman -S --noconfirm --needed python >/dev/null || exit 1
        else
          echo "no supported package manager found" >&2
          exit 1
        fi
        echo "installed python"
      become: "{{ bootstrap_uid.stdout | trim != '0' }}"
      register: bootstrap_python
      changed_when: "'installed python' in bootstrap_python.stdout"
      tags: [always]

- name: Ansible-Rathole-Webguard
  hosts: webservers
  become: true # All tasks in this play will run with root privileges
  gather_facts: true
  serial: 1 # Process one host at a time (prevents overload on slow machines)
  any_errors_fatal: true # Stop on first error to avoid partial deployments

  pre_tasks:
    # group_vars/all.yml is optional; missing settings get their documented defaults
    # Static import, so the defaults also apply when only some tags are selected
    - name: Apply defaults for global settings
      ansible.builtin.import_tasks: tasks/global_defaults.yml
      tags: [always]

    - name: Ensure this playbook runs on a supported system
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['Debian', 'Archlinux']
        fail_msg: "This playbook supports Debian, Ubuntu and Arch Linux, not {{ ansible_facts['distribution'] }}."
        quiet: true

    # CrowdSec publishes its release archives for x86_64 only
    - name: Ensure Arch Linux runs on x86_64
      ansible.builtin.assert:
        that: ansible_facts['architecture'] == 'x86_64'
        fail_msg: "Arch Linux is supported on x86_64 only."
        quiet: true
      when: ansible_facts['os_family'] == 'Archlinux'

    # --- Preflight validation: fail early, before anything is changed ---
    - name: Validate rathole_role
      ansible.builtin.assert:
        that:
          - rathole_role is defined
          - rathole_role in ['server', 'client']
        fail_msg: "rathole_role must be set to 'server' or 'client' for every host (in inventory.ini or host_vars)."
        quiet: true
      tags: [always]

    - name: Validate that wildcard support has Cloudflare enabled
      ansible.builtin.assert:
        that: enable_cloudflare | default(false) | bool
        fail_msg: "enable_wildcard requires enable_cloudflare: true (wildcard certificates use the Cloudflare DNS challenge)."
        quiet: true
      when:
        - rathole_role == 'server'
        - enable_wildcard | default(false) | bool
      tags: [always]

    - name: Validate Cloudflare API token
      ansible.builtin.assert:
        that:
          - cloudflare_api_token is defined
          - cloudflare_api_token | string | length > 0
        fail_msg: "enable_cloudflare is true, but cloudflare_api_token is undefined or empty."
        quiet: true
      when:
        - rathole_role == 'server'
        - enable_cloudflare | default(false) | bool
      tags: [always]

    - name: Validate that the server has sites in traditional mode
      ansible.builtin.assert:
        that: >-
          (caddy_sites | default([]) | length > 0)
          or (tunnel_services | default([], true) | map(attribute='domain', default='') | select | list | length > 0)
        fail_msg: "enable_wildcard is false, so caddy_sites or a tunnel_services entry with a domain is required."
        quiet: true
      when:
        - rathole_role == 'server'
        - not (enable_wildcard | bool)
      tags: [always]

    - name: Validate tunnel tuple settings before changing anything
      ansible.builtin.import_role:
        name: rathole
        tasks_from: tunnel_validate
      when: (tunnel_services | default(none)) is not none
      tags: [always]

    - name: Validate that CrowdSec import has CrowdSec enabled
      ansible.builtin.assert:
        that: enable_crowdsec | default(false) | bool
        fail_msg: "enable_crowdsec_import requires enable_crowdsec: true."
        quiet: true
      when:
        - rathole_role == 'server'
        - enable_crowdsec_import | default(false) | bool
      tags: [always]

    - name: Ensure APT cache is updated and perform a system upgrade (Debian-based systems)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: "{{ apt_upgrade_mode | default('safe') }}"
        autoremove: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Install common system utilities (Debian-based systems)
      ansible.builtin.apt:
        name:
          - curl # For downloading files
          - unzip # For extracting archives
          - git # For version control and cloning repositories
        state: present
      when: ansible_facts['os_family'] == "Debian"
      tags: [base]

    # Arch Linux is upgraded as a whole, only here: there is no update timer
    - name: Upgrade the system (Arch Linux)
      community.general.pacman:
        update_cache: true
        upgrade: true
      when: ansible_facts['os_family'] == "Archlinux"

    - name: Install common system utilities (Arch Linux)
      community.general.pacman:
        name: [curl, unzip, git]
        state: present
      when: ansible_facts['os_family'] == "Archlinux"
      tags: [base]

    - name: Ensure /usr/local/bin exists
      ansible.builtin.file:
        path: /usr/local/bin
        state: directory
        mode: "0755"
      tags: [base]

  roles:
    # Small-host tuning (journald size limit, optional swap file, security updates).
    # Runs first so swap is available before the memory-hungry Caddy build.
    # Set 'enable_system_tuning: false' to skip it (default: true).
    - role: system
      when: enable_system_tuning | default(true) | bool
      tags: system

    # The 'caddy' role is applied only when this host is designated as a Rathole 'server'.
    # Caddy acts as the web server and reverse proxy in the server setup.
    # Dependencies (go_lang, xcaddy) run first, once, via the caddy role's meta/main.yml.
    - role: caddy
      when: rathole_role == "server"
      tags: caddy

    # The 'crowdsec' role provides security and is optional.
    # It's included only if the host is a Rathole 'server' AND 'enable_crowdsec' is true.
    - role: crowdsec
      when: rathole_role == "server" and enable_crowdsec | bool
      tags: crowdsec

    # CrowdSec blocklist import role
    # Only included if host is a Rathole 'server' AND crowdsec_import is enabled.
    # Depends on the python role (meta/main.yml). The crowdsec role above must
    # run first; the role asserts enable_crowdsec instead of depending on it.
    - role: crowdsec_import
      when: rathole_role == "server" and enable_crowdsec_import | bool
      tags: crowdsec_import

    # The 'rathole' role is always applied. Its internal tasks will
    # conditionally configure it as a 'server' or 'client' based on the
    # 'rathole_role' variable defined for the host.
    - role: rathole
      tags: rathole

    # Optional nftables firewall on the server, for hosts without a trusted
    # provider firewall. Runs last: it opens the ports of the Rathole config.
    # Always included on the server: with enable_firewall: false it removes
    # the rules of an earlier run.
    - role: firewall
      when: rathole_role == "server"
      tags: firewall

  post_tasks:
    - name: Check if reboot is required after package upgrades
      ansible.builtin.import_tasks: tasks/reboot_required.yml
      tags: [reboot]

    # ansible.builtin.reboot already waits until the host is reachable again
    - name: Reboot host if required
      ansible.builtin.reboot:
        msg: "System rebooting due to package upgrades."
        pre_reboot_delay: 5
        post_reboot_delay: 10
        connect_timeout: 300
      when:
        - enable_auto_reboot | default(true) | bool # Set to 'false' to only report pending reboots
        - reboot_required | bool
      tags: [reboot]

    - name: Report pending reboot
      ansible.builtin.debug:
        msg: "A reboot is required after package upgrades but enable_auto_reboot is false."
      when:
        - not (enable_auto_reboot | default(true) | bool)
        - reboot_required | bool
      tags: [reboot]

    # Temporary download/build files are cleaned up by each role itself
    # Housekeeping, not a configuration change: always reported as changed by apt
    - name: Clean up APT package cache to save disk space
      ansible.builtin.apt:
        clean: true
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"
      tags: [cleanup]

    # pacman keeps every downloaded version; keep only the installed ones
    - name: Clean up pacman package cache to save disk space
      ansible.builtin.command: pacman -Sc --noconfirm
      changed_when: false
      when: ansible_facts['os_family'] == "Archlinux"
      tags: [cleanup]
