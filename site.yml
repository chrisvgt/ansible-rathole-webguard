- name: Ansible-Rathole-Webguard
  hosts: webservers
  become: true # All tasks in this play will run with root privileges
  gather_facts: true

  pre_tasks:
    - name: Ensure this playbook is only executed on Debian-based systems
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Debian"
        fail_msg: "This playbook can only be executed on Debian-based systems (e.g., Ubuntu, Debian)."
        success_msg: "System is Debian-based. Proceeding with the playbook."

    - name: Ensure APT cache is updated and perform a system upgrade (Debian-based systems)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: "{{ apt_upgrade_mode | default('safe') }}"
        autoremove: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install common system utilities (Debian-based systems)
      ansible.builtin.apt:
        name:
          - build-essential # For compiling software (e.g., Go/Caddy)
          - curl # For downloading files
          - unzip # For extracting archives
          - git # For version control and cloning repositories
        state: present
      when: ansible_facts["os_family"] == "Debian"
      tags: [base]

    - name: Ensure /usr/local/bin exists
      ansible.builtin.file:
        path: /usr/local/bin
        state: directory
        mode: "0755" # Standard permissions for executable binaries
      tags: [base]

  roles:
    # The 'go_lang' and 'xcaddy' roles are prerequisites for building Caddy.
    # They are only included if the host is configured as a Rathole 'server'
    # because server mode typically involves Caddy as a reverse proxy.
    - role: go_lang
      when: rathole_role == "server"
      tags: go

    - role: xcaddy
      when: rathole_role == "server"
      tags: xcaddy

    # The 'caddy' role is applied only when this host is designated as a Rathole 'server'.
    # Caddy acts as the web server and reverse proxy in the server setup.
    - role: caddy
      when: rathole_role == "server"
      tags: caddy

    # The 'crowdsec' role provides security and is optional.
    # It's included only if the host is a Rathole 'server' AND 'enable_crowdsec' is true.
    - role: crowdsec
      when: rathole_role == "server" and enable_crowdsec
      tags: crowdsec

    # Python role for pipx installation (required for crowdsec-blocklist-import)
    # Only included if host is a Rathole 'server' AND crowdsec_import is enabled
    - role: python
      when: rathole_role == "server" and enable_crowdsec_import
      tags: python

    # CrowdSec blocklist import role
    # Only included if host is a Rathole 'server' AND crowdsec_import is enabled
    # AND crowdsec is also enabled (dependency)
    - role: crowdsec_import
      when: rathole_role == "server" and enable_crowdsec_import and enable_crowdsec
      tags: crowdsec_import

    # The 'rathole' role is always applied. Its internal tasks will
    # conditionally configure it as a 'server' or 'client' based on the
    # 'rathole_role' variable defined for the host.
    - role: rathole
      tags: rathole

  post_tasks:
    - name: Check if reboot is required after package upgrades
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      tags: [reboot]

    - name: Reboot host if required
      ansible.builtin.reboot:
        msg: "System rebooting due to package upgrades."
        pre_reboot_delay: 5
        post_reboot_delay: 10
        connect_timeout: 300
      when:
        - ansible_facts["os_family"] == "Debian"
        - reboot_required_file.stat.exists or (apt_upgrade_mode | default('safe')) == 'dist'
      tags: [reboot]

    - name: Wait for host to reboot
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300
      when:
        - ansible_facts["os_family"] == "Debian"
        - reboot_required_file.stat.exists or (apt_upgrade_mode | default('safe')) == 'dist'
      tags: [reboot]

    - name: Clean up APT package cache to save disk space
      ansible.builtin.apt:
        clean: true
      tags: [cleanup]

    - name: Clean up global temporary files from roles
      ansible.builtin.shell:
        cmd: |
          rm -f /tmp/go*.tar.gz
          rm -f /tmp/xcaddy_temp.tar.gz
          rm -f /tmp/xcaddy
          rm -f /tmp/rathole_*.zip
          rm -rf /tmp/rathole_unpacked
          rm -f /tmp/install_crowdsec.sh
          rm -rf /tmp/caddy_build
          rm -rf /tmp/caddy_plugins
        executable: /bin/bash
      changed_when: false
      tags: [cleanup]
