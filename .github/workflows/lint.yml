name: Lint Ansible

"on":
  # Changes reach develop through pull requests, which already ran this, and
  # the release pull request runs it again; a push run there would repeat it
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # The pre-commit hook only scans staged changes; this scans the whole history
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --no-banner --redact --verbose .

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Build the development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          load: true
          tags: ansible-rathole-webguard-dev:local
          build-args: |
            PYTHON_VERSION=${{ steps.python.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The firewall test runs nftables with conntrack in a container, which
      # cannot load kernel modules itself
      - name: Load nftables kernel modules
        run: sudo modprobe -a nf_tables nft_ct

      - name: Yamllint, ansible-lint and syntax check
        run: ./docker.sh lint

      - name: Tests
        run: ./docker.sh test

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'docker/requirements.txt') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Pre-commit (format checks)
        env:
          WEBGUARD_PRECOMMIT_CACHE: ${{ runner.temp }}/pre-commit
        run: ./docker.sh pre-commit
