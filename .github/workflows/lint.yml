name: Lint Ansible

"on":
  # Changes reach develop through pull requests, which already ran this, and
  # the release pull request runs it again; a push run there would repeat it
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The firewall test runs nftables with conntrack in a container, which
      # cannot load kernel modules itself
      - name: Load nftables kernel modules
        run: sudo modprobe -a nf_tables nft_ct

      # The first command builds the development image, the others reuse it
      - name: Yamllint, ansible-lint and syntax check
        run: ./docker.sh lint

      - name: Tests
        run: ./docker.sh test

      - name: Pre-commit (format checks)
        run: ./docker.sh pre-commit
