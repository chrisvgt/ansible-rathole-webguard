name: Lint Ansible

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible ansible-lint pre-commit

      - name: Yamllint (strict, warnings fail)
        run: yamllint -s .

      - name: Ansible-lint
        env:
          ANSIBLE_DEPRECATION_WARNINGS: "false"
        run: ansible-lint -v site.yml

      - name: Playbook syntax check
        run: ansible-playbook --syntax-check -i localhost, site.yml

      - name: Pre-commit (format checks)
        run: |
          pre-commit install-hooks
          pre-commit run --all-files || (
            echo "Pre-commit checks failed. Please run 'pre-commit run --all-files' locally to auto-fix." && exit 1
          )
