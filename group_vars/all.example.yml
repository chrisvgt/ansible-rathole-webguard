# Copy to group_vars/all.yml (gitignored). Global settings for all hosts;
# settings that are missing fall back to the defaults shown here.

# --- System maintenance (defaults shown, uncomment to change) ---
# apt_upgrade_mode: "safe" # apt upgrade on every run: safe | full | dist | yes | no (no = skip)
# enable_auto_reboot: true # Reboot when package upgrades need it (new kernel); false = only report it
# enable_system_tuning: true # system role: journald size limit, optional swap file, security updates

# Global toggle for ratelimit
enable_rate_limit: true

# Global toggle for Cloudflare DNS challenges
enable_cloudflare: false # 'true' uses Cloudflare DNS for certificates and builds its Caddy plugin

# Global toggle for Wildcard support, requires Cloudflare
# true: one wildcard certificate per base domain, false: one per domain
enable_wildcard: false

# Global toggle for CrowdSec integration
enable_crowdsec: true # Set to 'false' to disable CrowdSec installation and its Caddy plugin

# Global toggle for CrowdSec blocklist import integration
enable_crowdsec_import: false # Set to 'false' to disable CrowdSec blocklist import installation

# Global toggle for Coraza WAF
enable_coraza_waf: false # Set to 'true' to enable Coraza WAF plugin for Caddy

# Global toggle for the nftables firewall on the server (if the provider firewall is not used or trusted)
enable_firewall: false

# Coraza WAF mode: recommended | minimal | moderate | strict | off
coraza_mode_default: recommended

# File whitelist: skip WAF for static files (GET only, improves performance)
# Set to false to disable, or customize the extensions list
coraza_file_whitelist_enabled: true
coraza_file_whitelist_extensions: "css|js|jpe?g|png|gif|ico|svg|webp|avif|woff2?|ttf|eot|pdf|txt|csv"
# --- WAF advanced tuning (optional - sensible defaults apply) ---
# coraza_audit_log_enabled: true
# coraza_audit_log_dir: "/var/log/caddy/coraza" # Keep it outside /var/log/caddy/*.log (CrowdSec reads those)
# coraza_block_uploads: false # minimal mode only
# coraza_upload_blocklist: ['php','phtml','phar','exe','jar','war','dmg','msi','vbs','ps1','sh','bat','com','scr','pif','aspx','cer','cfm','cgi','pl','py','rb','jsp']

# Mode-specific request body limits in bytes (uncomment to override defaults)
# coraza_minimal_body_limit: 536870912
# coraza_minimal_body_inmemory_limit: 134217728
# coraza_minimal_nofiles_body_limit: 10485760
