# Copy to inventory.ini (gitignored) and fill in your hosts.
#
# Each tunnel tuple is one group with one server (VPS) and one client (home
# server). Its settings live in group_vars/<group>.yml, see
# group_vars/tunnel.example.yml. Add more tuples as more groups.
#
# host_key_checking is enabled in ansible.cfg: connect to each host once with
# ssh and verify its fingerprint, so it is in ~/.ssh/known_hosts.
#
# Format: <name> ansible_host=<IP> rathole_role=<server|client> ansible_port=<SSH_PORT> ansible_user=<SSH_USER> ansible_ssh_private_key_file=<KEY>
# List the server before the client: on a new tuple the server creates the tunnel keys.
# Logging in as root (e.g. a fresh Arch Linux) works without sudo: ansible_user=root

[tunnel_home]
vps ansible_host=203.0.113.10 rathole_role=server ansible_port=22 ansible_user=ssh_user ansible_ssh_private_key_file=~/.ssh/id_ed25519
home ansible_host=192.168.1.20 rathole_role=client ansible_port=22 ansible_user=ssh_user ansible_ssh_private_key_file=~/.ssh/id_ed25519

[webservers:children]
tunnel_home
