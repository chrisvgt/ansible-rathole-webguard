# Copy to inventory.ini (gitignored) and fill in your hosts.
#
# The host names (server, client) select host_vars/server.yml and
# host_vars/client.yml. If you rename a host, rename its host_vars file and
# update hostvars['server'] in host_vars/client.yml.
#
# host_key_checking is enabled in ansible.cfg: connect to each host once with
# ssh and verify its fingerprint, so it is in ~/.ssh/known_hosts.

[webservers]
# Format: <name> ansible_host=<IP> ansible_port=<SSH_PORT> ansible_user=<SSH_USER> ansible_ssh_private_key_file=<KEY>

server ansible_host=203.0.113.10 ansible_port=22 ansible_user=ssh_user ansible_ssh_private_key_file=~/.ssh/id_ed25519
client ansible_host=192.168.1.20 ansible_port=22 ansible_user=ssh_user ansible_ssh_private_key_file=~/.ssh/id_ed25519
