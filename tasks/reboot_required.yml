---
# tasks/reboot_required.yml
# Sets reboot_required after package upgrades. Debian and Ubuntu flag it with a
# file; Arch Linux removes the modules of the running kernel when it upgrades
# the kernel, so the running kernel's module directory is missing.

- name: Check for the reboot flag
  ansible.builtin.stat:
    path: >-
      {{ reboot_required_debian_file | default('/var/run/reboot-required')
         if ansible_facts['os_family'] == 'Debian'
         else reboot_required_modules_dir | default('/usr/lib/modules/' ~ ansible_facts['kernel']) }}
  register: reboot_required_flag

- name: Decide whether a reboot is required
  ansible.builtin.set_fact:
    reboot_required: >-
      {{ reboot_required_flag.stat.exists
         if ansible_facts['os_family'] == 'Debian'
         else not reboot_required_flag.stat.exists }}
