---
# tests/test_reboot_required.yml
# A reboot is required on Debian when /var/run/reboot-required exists, on Arch
# Linux when the modules of the running kernel are gone (kernel upgraded).

- name: Detect a pending reboot
  hosts: srv
  gather_facts: false
  tasks:
    - name: Arch Linux after a kernel upgrade
      ansible.builtin.include_tasks: ../tasks/reboot_required.yml
      vars:
        ansible_facts: { os_family: Archlinux, kernel: "6.0.0-test" }
        reboot_required_modules_dir: /nonexistent/modules

    - name: Check that a reboot is required
      ansible.builtin.assert:
        that: reboot_required is true

    - name: Arch Linux with the running kernel installed
      ansible.builtin.include_tasks: ../tasks/reboot_required.yml
      vars:
        ansible_facts: { os_family: Archlinux, kernel: "6.0.0-test" }
        reboot_required_modules_dir: /

    - name: Check that no reboot is required
      ansible.builtin.assert:
        that: reboot_required is false

    - name: Debian without the reboot-required file
      ansible.builtin.include_tasks: ../tasks/reboot_required.yml
      vars:
        ansible_facts: { os_family: Debian, kernel: "6.0.0-test" }
        reboot_required_debian_file: /nonexistent/reboot-required

    - name: Check that Debian needs no reboot
      ansible.builtin.assert:
        that: reboot_required is false

    - name: Debian with the reboot-required file
      ansible.builtin.include_tasks: ../tasks/reboot_required.yml
      vars:
        ansible_facts: { os_family: Debian, kernel: "6.0.0-test" }
        reboot_required_debian_file: /

    - name: Check that Debian needs a reboot
      ansible.builtin.assert:
        that: reboot_required is true

    # A container runs the host's kernel, whose modules it never has
    - name: Arch Linux in a container
      ansible.builtin.include_tasks: ../tasks/reboot_required.yml
      vars:
        ansible_facts:
          os_family: Archlinux
          kernel: "6.0.0-test"
          virtualization_role: guest
          virtualization_type: lxc
        reboot_required_modules_dir: /nonexistent/modules

    - name: Check that a container needs no reboot
      ansible.builtin.assert:
        that: reboot_required is false
