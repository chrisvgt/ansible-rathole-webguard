---
# tests/test_rathole_secrets_given.yml
# Keys and token set in the tuple are used as-is and nothing is written

- name: Use given Noise keys and token
  hosts: tunnel_test
  gather_facts: false
  vars:
    rathole_config_path: /nonexistent/rathole-test
    rathole_noise_private_key: given-private
    rathole_noise_public_key: given-public
    rathole_default_token: given-token
  tasks:
    - name: Run tunnel derivation and secrets
      ansible.builtin.include_role:
        name: rathole
        tasks_from: "{{ item }}"
      loop: [tunnel, secrets]

    - name: Check secrets in server config
      ansible.builtin.assert:
        that:
          - rathole_server_config.transport.noise.local_private_key == 'given-private'
          - rathole_server_config.transport.noise.pattern == 'Noise_NK_25519_ChaChaPoly_BLAKE2s'
          - rathole_server_config.default_token == 'given-token'
      when: rathole_role == 'server'

    - name: Check secrets in client config
      ansible.builtin.assert:
        that:
          - rathole_client_config.transport.noise.remote_public_key == 'given-public'
          - rathole_client_config.default_token == 'given-token'
      when: rathole_role == 'client'
