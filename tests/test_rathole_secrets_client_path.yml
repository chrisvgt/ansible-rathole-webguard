---
# tests/test_rathole_secrets_client_path.yml
# The client reads the secrets from the server's rathole_config_path, not its own

- name: Read secrets from the server's config directory
  hosts: tunnel_test
  gather_facts: false
  tasks:
    - name: Create temporary config directory
      ansible.builtin.tempfile:
        state: directory
      register: test_dir
      run_once: true

    - name: Use the temporary directory on the server only
      ansible.builtin.set_fact:
        rathole_config_path: "{{ test_dir.path if rathole_role == 'server' else test_dir.path ~ '/client-only' }}"

    - name: Create key and token files
      ansible.builtin.copy:
        dest: "{{ test_dir.path }}/{{ item.file }}"
        content: "{{ item.value }}\n"
        mode: "0600"
      loop:
        - { file: noise.key, value: file-private }
        - { file: noise.pub, value: file-public }
        - { file: default_token, value: file-token }
      run_once: true

    - name: Run tunnel derivation and secrets
      ansible.builtin.include_role:
        name: rathole
        tasks_from: "{{ item }}"
      loop: [tunnel, secrets]

    - name: Check client secrets
      ansible.builtin.assert:
        that:
          - rathole_client_config.transport.noise.remote_public_key == 'file-public'
          - rathole_client_config.default_token == 'file-token'
      when: rathole_role == 'client'

    - name: Remove temporary config directory
      ansible.builtin.file:
        path: "{{ test_dir.path }}"
        state: absent
      run_once: true
