---
# tests/test_crowdsec_login_bf.yml
# Failed login detection: the path pattern and the rendered scenario

- name: Render the failed login scenario
  hosts: srv
  gather_facts: false
  tasks:
    - name: Load CrowdSec defaults
      ansible.builtin.include_vars: ../roles/crowdsec/defaults/main.yml

    # Python and Go (CrowdSec) regex agree on this simple pattern
    - name: Check the login path pattern
      ansible.builtin.assert:
        that:
          - test_login_paths | reject('search', crowdsec_login_path_pattern) | list == []
          - test_other_paths | select('search', crowdsec_login_path_pattern) | list == []
      vars:
        test_login_paths:
          - /login
          - /api/auth/login
          - /user/sign_in
          - /users/sign-in
          - /SignIn
          - /Users/AuthenticateByName
          - /identity/connect/token
          - /api/v1/oauth/token
        test_other_paths: [/api/items, /Sessions/Playing/Progress, /upload, /api/search]

    - name: Create temporary file
      ansible.builtin.tempfile:
        suffix: .yaml
      register: test_file

    - name: Render and check
      block:
        - name: Render scenario
          ansible.builtin.template:
            src: ../roles/crowdsec/templates/login-bf.yaml.j2
            dest: "{{ test_file.path }}"
            mode: "0600"

        - name: Read scenario
          ansible.builtin.slurp:
            src: "{{ test_file.path }}"
          register: test_content

        - name: Parse scenario
          ansible.builtin.set_fact:
            test_scenario: "{{ test_content.content | b64decode | from_yaml }}"

        # Query strings are cut off before matching, statuses are strings like the
        # parser's; a success on the same path from the same IP resets the count
        - name: Check the scenario
          ansible.builtin.assert:
            that:
              - test_scenario.name == 'local/login-bf'
              - test_scenario.type == 'leaky'
              - test_scenario.capacity == crowdsec_login_bf_capacity
              - test_scenario.leakspeed == crowdsec_login_bf_leakspeed
              - test_scenario.labels.remediation
              - >-
                test_scenario.filter == "evt.Meta.log_type == 'http_access-log' && evt.Meta.http_verb == 'POST'
                && Split(evt.Meta.http_path, \"?\")[0] matches " ~ (crowdsec_login_path_pattern | to_json) ~ "
                && (evt.Meta.http_status in [\"400\", \"401\", \"403\"] || evt.Meta.http_status matches \"^[23]\")"
              - test_scenario.cancel_on == 'evt.Meta.http_status matches "^[23]"'
              - test_scenario.groupby == 'evt.Meta.source_ip + " " + Split(evt.Meta.http_path, "?")[0]'

      always:
        - name: Remove temporary file
          ansible.builtin.file:
            path: "{{ test_file.path }}"
            state: absent
