---
# tests/examples.yml
# The example files work as copied: run by tests/run.sh against a copy of
# inventory.example.ini and group_vars/*.example.yml

- name: Check the example tuple
  hosts: webservers
  gather_facts: false
  vars:
    ansible_connection: local
  tasks:
    - name: Apply global defaults
      ansible.builtin.include_tasks: "{{ repo_dir }}/tasks/global_defaults.yml"

    - name: Run Rathole derivation
      ansible.builtin.include_role:
        name: rathole
        tasks_from: tunnel

    - name: Load Caddy role constants
      ansible.builtin.include_vars: "{{ repo_dir }}/roles/caddy/vars/main.yml"

    - name: Run Caddy site derivation
      ansible.builtin.include_tasks: "{{ repo_dir }}/roles/caddy/tasks/sites.yml"
      when: rathole_role == 'server'

    - name: Check example result
      ansible.builtin.assert:
        that: >-
          (rathole_role == 'server' and caddy_effective_sites | length == 4
           and rathole_server_config.services | length == 4)
          or (rathole_role == 'client' and rathole_client_config.remote_addr == '203.0.113.10:2333')
