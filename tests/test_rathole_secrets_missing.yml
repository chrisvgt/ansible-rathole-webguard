---
# tests/test_rathole_secrets_missing.yml
# A client whose server never ran fails with a message naming the server

- name: Fail clearly when the server has no keys yet
  hosts: cli
  gather_facts: false
  vars:
    rathole_config_path: /nonexistent/rathole-test
  tasks:
    - name: Run tunnel derivation and secrets
      block:
        - name: Run tunnel derivation and secrets
          ansible.builtin.include_role:
            name: rathole
            tasks_from: "{{ item }}"
          loop: [tunnel, secrets]
      rescue:
        - name: Remember failure message
          ansible.builtin.set_fact:
            rejected_msg: "{{ ([ansible_failed_result.msg | default('')] + (ansible_failed_result.results | default([]) | map(attribute='msg', default='') | list)) | join(' ') }}"

    - name: Check that the run failed with a hint to the server
      ansible.builtin.assert:
        that:
          - rejected_msg is defined
          - "'Run the playbook for srv first' in rejected_msg"
