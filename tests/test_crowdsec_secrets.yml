---
# tests/test_crowdsec_secrets.yml
# The Caddy bouncer key and the blocklist import machine password are generated
# once and stored on the server; values set by the user take precedence

- name: Generate and keep CrowdSec secrets
  hosts: srv
  gather_facts: false
  tasks:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: test_dir

    - name: Use temporary secret files
      ansible.builtin.set_fact:
        crowdsec_bouncer_key_file: "{{ test_dir.path }}/caddy.bouncer.key"
        crowdsec_import_machine_password_file: "{{ test_dir.path }}/blocklist-import.machine.password"

    - name: Run and check
      block:
        - name: Resolve secrets on a new server
          ansible.builtin.include_tasks: tasks/crowdsec_secrets.yml

        - name: Read stored secrets
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop: ["{{ crowdsec_bouncer_key_file }}", "{{ crowdsec_import_machine_password_file }}"]
          register: test_stored

        - name: Check stored file modes
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: ["{{ crowdsec_bouncer_key_file }}", "{{ crowdsec_import_machine_password_file }}"]
          register: test_stat

        - name: Check secrets are generated and stored
          ansible.builtin.assert:
            that:
              - test_stat.results | map(attribute='stat.mode') | unique | list == ['0600']
              - crowdsec_bouncer_key is match('^[A-Za-z0-9]{32}$')
              - crowdsec_import_blocklist_machine_password is match('^[A-Za-z0-9]{32}$')
              - crowdsec_bouncer_key != crowdsec_import_blocklist_machine_password
              - test_stored.results[0].content | b64decode | trim == crowdsec_bouncer_key
              - test_stored.results[1].content | b64decode | trim == crowdsec_import_blocklist_machine_password

        - name: Remember generated secrets
          ansible.builtin.set_fact:
            test_first_key: "{{ crowdsec_bouncer_key }}"
            test_first_password: "{{ crowdsec_import_blocklist_machine_password }}"

        - name: Resolve secrets again
          ansible.builtin.include_tasks: tasks/crowdsec_secrets.yml

        - name: Check stored secrets are kept
          ansible.builtin.assert:
            that:
              - crowdsec_bouncer_key == test_first_key
              - crowdsec_import_blocklist_machine_password == test_first_password

        - name: Set secrets in the configuration
          ansible.builtin.set_fact:
            crowdsec_api_key: user-bouncer-key
            crowdsec_machine_password: user-machine-password

        - name: Resolve configured secrets
          ansible.builtin.include_tasks: tasks/crowdsec_secrets.yml

        - name: Read stored secrets again
          ansible.builtin.slurp:
            src: "{{ crowdsec_bouncer_key_file }}"
          register: test_stored_again

        - name: Check configured secrets win and stored files stay
          ansible.builtin.assert:
            that:
              - crowdsec_bouncer_key == 'user-bouncer-key'
              - crowdsec_import_blocklist_machine_password == 'user-machine-password'
              - test_stored_again.content | b64decode | trim == test_first_key
      always:
        - name: Remove temporary directory
          ansible.builtin.file:
            path: "{{ test_dir.path }}"
            state: absent

# Older tuple files reference vault variables; without a vault they are undefined
- name: Treat undefined vault references as not set
  hosts: cli
  gather_facts: false
  vars:
    crowdsec_api_key: "{{ vault_crowdsec_api_key }}"
    crowdsec_machine_password: "{{ vault_crowdsec_machine_password }}"
  tasks:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: test_dir

    - name: Run and check
      block:
        - name: Resolve secrets
          ansible.builtin.include_tasks: tasks/crowdsec_secrets.yml
          vars:
            crowdsec_bouncer_key_file: "{{ test_dir.path }}/caddy.bouncer.key"
            crowdsec_import_machine_password_file: "{{ test_dir.path }}/blocklist-import.machine.password"

        - name: Check secrets are generated
          ansible.builtin.assert:
            that:
              - crowdsec_bouncer_key is match('^[A-Za-z0-9]{32}$')
              - crowdsec_import_blocklist_machine_password is match('^[A-Za-z0-9]{32}$')
      always:
        - name: Remove temporary directory
          ansible.builtin.file:
            path: "{{ test_dir.path }}"
            state: absent
