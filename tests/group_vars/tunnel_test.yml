---
# tests/group_vars/tunnel_test.yml

tunnel_id: test

tunnel_services:
  - name: web
    domain: web.example.com
    local_addr: 127.0.0.1:2368
    coraza_mode: minimal
  - name: stream
    domain:
      - watch.example.com
      - watch.example.org
    local_addr: 192.168.1.10:8096
    stream: true
  - name: apex
    domain: example.com
    local_addr: 127.0.0.1:8080
  - name: rd-tcp
    local_addr: 127.0.0.1:21116
    bind_addr: 0.0.0.0:21116
  - name: rd-udp
    type: udp
    local_addr: 127.0.0.1:21116
    bind_addr: 0.0.0.0:21116
