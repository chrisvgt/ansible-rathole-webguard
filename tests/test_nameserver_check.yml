---
# tests/test_nameserver_check.yml
# Caddy and its Go build read only /etc/resolv.conf. Without a nameserver line
# they fall back to localhost:53, so the server run stops early.

- name: Check the nameserver of the server
  hosts: srv
  gather_facts: false
  tasks:
    - name: Create the resolver files
      ansible.builtin.tempfile:
        state: directory
      register: nameserver_dir

    - name: Write a resolver file with a nameserver and one without
      ansible.builtin.copy:
        dest: "{{ nameserver_dir.path }}/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - { name: stub, content: "# managed by systemd-resolved\nnameserver 127.0.0.53\noptions edns0\n" }
        - { name: dhcpcd, content: "# Generated by dhcpcd\n# /etc/resolv.conf.head can replace this line\n" }

    - name: Accept a resolver file with a nameserver
      ansible.builtin.include_tasks: ../tasks/nameserver_check.yml
      vars:
        nameserver_check_file: "{{ nameserver_dir.path }}/stub"

    - name: Resolver file without a nameserver
      block:
        - name: Check a resolver file without a nameserver
          ansible.builtin.include_tasks: ../tasks/nameserver_check.yml
          vars:
            nameserver_check_file: "{{ nameserver_dir.path }}/dhcpcd"
      rescue:
        - name: Remember failure message
          ansible.builtin.set_fact:
            rejected_without: "{{ ansible_failed_result.msg | default('') }}"

    - name: Missing resolver file
      block:
        - name: Check a missing resolver file
          ansible.builtin.include_tasks: ../tasks/nameserver_check.yml
          vars:
            nameserver_check_file: "{{ nameserver_dir.path }}/missing"
      rescue:
        - name: Remember failure message
          ansible.builtin.set_fact:
            rejected_missing: "{{ ansible_failed_result.msg | default('') }}"

    - name: Remove the resolver files
      ansible.builtin.file:
        path: "{{ nameserver_dir.path }}"
        state: absent

    - name: Check that both were rejected with a hint
      ansible.builtin.assert:
        that:
          - "'lists no nameserver' in rejected_without | default('')"
          - "'lists no nameserver' in rejected_missing | default('')"
