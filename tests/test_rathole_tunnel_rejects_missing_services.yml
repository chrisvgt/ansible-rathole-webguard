---
# tests/test_rathole_tunnel_rejects_missing_services.yml
# Without tunnel_services there is nothing to configure

- name: Reject a host without tunnel_services
  hosts: srv
  gather_facts: false
  vars:
    tunnel_services: null
  tasks:
    - name: Run tunnel derivation
      block:
        - name: Run tunnel derivation
          ansible.builtin.include_role:
            name: rathole
            tasks_from: tunnel
      rescue:
        - name: Remember failure message
          ansible.builtin.set_fact:
            rejected_msg: "{{ ([ansible_failed_result.msg | default('')] + (ansible_failed_result.results | default([]) | map(attribute='msg', default='') | list)) | join(' ') }}"

    - name: Check that the configuration was rejected
      ansible.builtin.assert:
        that:
          - rejected_msg is defined
          - "'tunnel_services are required' in rejected_msg"
