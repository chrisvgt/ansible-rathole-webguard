# Test inventory for tests/check_integration.sh: two systemd containers,
# reached with the docker connection. No ansible_user on purpose: like hosts
# whose user comes from ~/.ssh/config.
[tunnel_it]
it-server ansible_host=it-server rathole_role=server
it-client ansible_host=it-client rathole_role=client

[tunnel_it:vars]
ansible_connection=community.docker.docker
ansible_python_interpreter=/usr/bin/python3

[webservers:children]
tunnel_it
