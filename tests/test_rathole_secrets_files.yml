---
# tests/test_rathole_secrets_files.yml
# Existing key and token files on the server are read; the client reads them from the server

- name: Read Noise keys and token from server files
  hosts: tunnel_test
  gather_facts: false
  tasks:
    - name: Create temporary config directory
      ansible.builtin.tempfile:
        state: directory
      register: test_dir
      run_once: true

    - name: Use temporary config directory
      ansible.builtin.set_fact:
        rathole_config_path: "{{ test_dir.path }}"
      run_once: true

    - name: Create key and token files
      ansible.builtin.copy:
        dest: "{{ test_dir.path }}/{{ item.file }}"
        content: "{{ item.value }}\n"
        mode: "0600"
      loop:
        - { file: noise.key, value: file-private }
        - { file: noise.pub, value: file-public }
        - { file: default_token, value: file-token }
      run_once: true

    - name: Run tunnel derivation and secrets
      ansible.builtin.include_role:
        name: rathole
        tasks_from: "{{ item }}"
      loop: [tunnel, secrets]

    - name: Check secrets
      ansible.builtin.assert:
        that: >-
          (rathole_role == 'server' and rathole_server_config.transport.noise.local_private_key == 'file-private'
           and rathole_server_config.default_token == 'file-token')
          or (rathole_role == 'client' and rathole_client_config.transport.noise.remote_public_key == 'file-public'
           and rathole_client_config.default_token == 'file-token')

    - name: Remove temporary config directory
      ansible.builtin.file:
        path: "{{ test_dir.path }}"
        state: absent
      run_once: true
