---
# tests/tasks/crowdsec_secrets.yml
# Shared by tests/test_crowdsec_secrets.yml: resolve both CrowdSec secrets

- name: Resolve Caddy bouncer key
  ansible.builtin.include_role:
    name: crowdsec
    tasks_from: bouncer_key

# Included directly: include_role would also run the role's dependencies
- name: Resolve blocklist import machine password
  ansible.builtin.include_tasks: ../../roles/crowdsec_import/tasks/machine_password.yml
