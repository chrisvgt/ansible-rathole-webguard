repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # The mirror's last stable tag is v3.1.0; the prettier version itself is pinned below
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.9.9
        files: \.(ya?ml|json|md)$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-s"]

  # Secret scan of the staged changes; CI scans the whole checkout
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint (whole repository)
        entry: ansible-lint
        language: system
        pass_filenames: false
